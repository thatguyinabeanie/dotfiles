# JankyBorders Configuration
# Window border styling for macOS
jankyborders:
  style: "round"            # none, round, square
  width: 6.0                # Border width in pixels
  hidpi: true               # Enable high DPI support
  colors:                   # Color configuration (hex format without 0x prefix)
    active: "ff94e2d5"      # Active window border color (catppuccin teal)
    inactive: "ff45475a"    # Inactive window border color (catppuccin surface1)
  ax_focus: true            # Enable accessibility focus integration
  blacklist:                # Apps to exclude from borders
    - "System Preferences"
  animations:               # - "Activity Monitor"
    enabled: true           # Enable border animations
    duration: 0.2           # Animation duration in seconds
