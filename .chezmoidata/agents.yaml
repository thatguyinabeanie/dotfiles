# AI Agents and Assistants
#
# AI-powered coding agents, CLI tools, and assistants that enhance development workflows
# with intelligent code suggestions, completions, and automated tasks.
#
# Installation Methods:
# - npm: Node.js packages installed globally
# - brew: Homebrew-managed tools
#
# Note: These are separate from AI provider configurations (anthropic.yaml, github-copilot.yaml, etc.)
# which define API credentials and model settings.

agents:
  # Code-focused AI agents
  - name: "claude-code"
    installer: [curl]
    description: "Anthropic Claude Code assistant"

  - name: "@openai/codex"
    installer: [npm]
    description: "OpenAI Codex CLI coding agent"

  - name: aider-chat
    installer: [pip]
    description: "AI pair programming in your terminal"

  - name: "@mariozechner/pi-coding-agent"
    installer: [npm]
    description: "Pi — minimal terminal coding agent (earendil-works/pi)"

  # Deployment and infrastructure tools
  - name: vercel
    installer: [npm]
    version: latest
    description: "Vercel deployment CLI"
