ai_opencode:
  # OpenCode AI configuration - follows opencode.ai schema
  model: "github-copilot/gemini-2.5-pro"
  small_model: "github-copilot/gemini-2.0-flash-001"
  autoupdate: true
  share: "manual"
  theme: "opencode"

  # Provider configurations (flat structure as per opencode schema)
  provider:
    github-copilot:
      models: {}
      options: {}

    anthropic:
      models: {}
      options:
        apiKey: "{env:ANTHROPIC_API_KEY}"

    google:
      models: {}
      options:
        apiKey: "{env:GOOGLE_API_KEY}"

    openrouter:
      models: {}
      options:
        apiKey: "{env:OPENROUTER_API_KEY}"
        site_url: "https://openrouter.ai"

  # Feature settings
  features:
    autocomplete: true
    chat: true
    inline_suggestions: true
    code_actions: true
    diagnostics: true
    hover: true
    signature_help: true

  # UI settings
  ui:
    theme: "dark"
    font_size: 14
    show_line_numbers: true
    word_wrap: true
    minimap: false

  # Keybindings
  keybindings:
    accept_suggestion: "Tab"
    dismiss_suggestion: "Escape"
    next_suggestion: "Alt+]"
    previous_suggestion: "Alt+["
    trigger_suggestion: "Ctrl+Space"

  # Privacy and data settings
  privacy:
    telemetry: false
    crash_reporting: false
    usage_analytics: false
    share_code_snippets: false

  # Performance settings
  performance:
    debounce_delay: 300
    max_suggestions: 10
    cache_size: 100
    timeout: 5000
