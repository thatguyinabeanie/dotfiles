opencode:
  # OpenCode AI configuration - follows opencode.ai schema
  model: "github-copilot/claude-opus-4.5"
  small_model: "opencode/code-supernova"
  autoupdate: true
  share: "manual"
  theme: "system"

  # Instructions - AGENTS.md files for context
  instructions:

  # Keybindings using valid OpenCode keybind names
  keybinds:
    leader: "ctrl+x"
    session_child_cycle: "ctrl+tab"

  # Provider configurations (object structure as per opencode schema)
  provider:
    anthropic: {}
    github-copilot: {}
    google: {}
    opencode: {}

  # MCP server configuration
  mcp:

# Provider-specific model configurations are now managed in .chezmoidata/ai/
# See .chezmoidata/ai/README.md for details
#
# Provider files:
#   - anthropic.yaml      (8 models, 200K context)
#   - google.yaml         (7 models, 400K context)
#   - github-copilot.yaml (11 models, 128K GitHub API limit)
#   - opencode.yaml       (2 models, custom limits)
#
# Models are automatically injected into the generated config via templates.
