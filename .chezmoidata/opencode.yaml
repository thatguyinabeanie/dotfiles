opencode:
  # OpenCode AI configuration - follows opencode.ai schema
  model: "github-copilot/claude-sonnet-4"
  small_model: "github-copilot/grok-code-fast-1"
  autoupdate: true
  share: "manual"
  theme: "system"

  # Instructions - AGENTS.md files for context
  instructions:

  # Keybindings using valid OpenCode keybind names
  keybinds:
    leader: "ctrl+x"
    session_child_cycle: "ctrl+tab"

  # Provider configurations (object structure as per opencode schema)
  provider:
    github-copilot: {}
    google: {}

  # MCP server configuration
  mcp:
    context7:
      type: "remote"
      url: "https://mcp.context7.com/mcp"
      headers:
        CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
      enabled: true
