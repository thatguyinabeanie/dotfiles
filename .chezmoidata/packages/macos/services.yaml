# Brew Services Configuration
# Services that should always be running
# These will be started if stopped, restarted if running
#
# Service Configuration Options:
# - name: Service name (required)
# - description: Human-readable description (optional)
# - action: "start" (only start if stopped) or "restart" (always restart) (required)
# - active: Controls whether the service should be running (required, boolean)
#   - true: Service should be running and managed
#   - false: Service should be stopped and not managed
# - condition: When to manage the service (optional, defaults to "always")
#   - "always": Always manage the service (default if not specified)
#   - "ifInstalled": Only manage if the service binary is installed on the system

services:
  # macOS Enhancements (conditionally installed)
  - name: "sketchybar"
    description: "Custom macOS menu bar"
    action: "restart"
    active: true
    condition: "ifInstalled"

  - name: "borders"
    active: false
    description: "Window borders for macOS"
    action: "start"

  - name: "redis"
    active: false
    description: "Redis in-memory data store"
    action: "start"

