cross_platform_node:
  package_managers:
    - name: bun
      version: latest
      description: "Fast JavaScript runtime"

    - name: deno
      version: latest
      description: "Modern JavaScript runtime"

    - name: node
      version: 22
      description: "Node.js JavaScript runtime"

    - name: pnpm
      version: latest
      description: "Fast Node.js package manager"

    - name: yarn
      version: latest
      description: "Node.js package manager"

  global_packages:
    - name: "@slidev/cli"
      description: "Slides dev cli"

    - name: "@mermaid-js/mermaid-cli"
      description: "Mermaid diagram CLI tool"

  ai_agents:
    - name: "@anthropic-ai/claude-code"
      description: "Claude AI code integration"

    - name: "@google/gemini-cli"
      description: "Google Gemini CLI tool"

    - name: "opencode-ai"
      description: "OpenCode AI"

    - name: "@augmentcode/auggie"
      description: "Augment Code Cli"

    - name: "@openai/codex"
      description: "OpenAI Codex Cli"

  mcp_servers:
    # MCP Servers (NPM packages)
    - name: "@modelcontextprotocol/server-filesystem"
      description: "MCP filesystem operations server"
    - name: "@modelcontextprotocol/server-memory"
      description: "MCP memory management server"
    - name: "mcp-hub"
      description: "MCP server registry and manager"
    - name: "mcp-neovim-server"
      description: "MCP server for Neovim integration"
    - name: vercel
      version: "44.5.5"
      description: "Vercel CLI tool"
