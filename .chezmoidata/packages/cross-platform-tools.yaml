cross_platform_tools:
  # General development tools and utilities
  system_tools:
    - name: bottom
      version: latest
      description: "System monitor (htop alternative)"
    - name: fastfetch
      version: latest
      description: "System information tool"

  data_tools:
    - name: jq
      version: latest
      description: "JSON processor"
    - name: hyperfine
      version: latest
      description: "Command-line benchmarking tool"

  documentation_tools:
    - name: marp-cli
      version: latest
      description: "Markdown presentation tool"
    - name: mdbook
      version: latest
      description: "Book generator from Markdown"

  infrastructure_tools:
    - name: helm
      version: latest
      description: "Kubernetes package manager"
    - name: k9s
      version: latest
      description: "Kubernetes CLI"
    - name: kubectl
      version: latest
      description: "Kubernetes CLI"
    - name: terraform
      version: latest
      description: "Infrastructure as code"

  build_tools:
    - name: act
      version: latest
      description: "Local GitHub Actions runner"
    - name: cmake
      version: latest
      description: "Build system generator"
    - name: make
      version: latest
      description: "Build automation tool"

  quality_tools:
    - name: hadolint
      version: latest
      description: "Dockerfile linter"
    - name: shellcheck
      version: latest
      description: "Shell script linter"
    - name: vale
      version: latest
      description: "Prose linter"

  git_tools:
    - name: delta
      version: latest
      description: "Git diff viewer"
    - name: github-cli
      version: latest
      description: "GitHub CLI tool"
    - name: gitleaks
      version: latest
      description: "Secret scanner for git repos"
    - name: gitsign
      version: latest
      description: "Keyless Git signing"
    - name: gitui
      version: latest
      description: "Git TUI interface"

  ai_tools:
    - name: claude
      version: latest
      description: "Anthropic Claude CLI"

  fun_tools:
    - name: "cargo:pokeget"
      version: latest
      description: "Pokemon sprite fetcher"

  other_languages:
    - name: elixir
      version: latest
      description: "Elixir programming language"
    - name: erlang
      version: latest
      description: "Erlang runtime (Elixir dependency)"
    - name: julia
      version: 1.11.6
      description: "Julia programming language for scientific computing"
    - name: ruby
      version: 3.2.7
      description: "Ruby programming language"
    - name: zig
      version: latest
      description: "Zig systems programming language"

  java_tools:
    - name: gradle
      version: latest
      description: "Build automation tool"
    - name: java
      version: zulu-8
      description: "Java runtime (Zulu JDK 8)"

  # Language servers and formatters for Neovim
  language_servers:
    # Core language servers installed by default
    core_tools:
      - name: prettierd
        version: latest
        description: "Fast Prettier daemon"
      - name: lua-language-server
        version: latest
        description: "Lua LSP"
      - name: marksman
        version: latest
        description: "Markdown LSP"
      - name: json-lsp
        version: latest
        description: "JSON LSP"
      - name: ruby-lsp
        version: latest
        description: "Ruby LSP"
      - name: standardrb
        version: latest
        description: "Ruby formatter"
      - name: haml-lint
        version: latest
        description: "HAML linter"

    # Additional tools for exploration and development
    exploration_tools:
      - name: css-lsp
        version: latest
        description: "CSS LSP"
      - name: dockerfile-language-server
        version: latest
        description: "Dockerfile LSP"
      - name: html-lsp
        version: latest
        description: "HTML LSP"
      - name: rust-analyzer
        version: latest
        description: "Rust LSP"
      - name: gopls
        version: latest
        description: "Go LSP"
      - name: prettier
        version: latest
        description: "Code formatter"
      - name: eslint-lsp
        version: latest
        description: "ESLint LSP for JavaScript/TypeScript"
      - name: typescript-language-server
        version: latest
        description: "TypeScript LSP"

    # CLI and specialized tools
    cli_tools:
      - name: ast-grep
        version: latest
        description: "AST-based search tool"
      - name: bash-debug-adapter
        version: latest
        description: "Bash debugger"
      - name: blackd-client
        version: latest
        description: "Black formatter client"
      - name: circleci-yaml-language-server
        version: latest
        description: "CircleCI YAML LSP"
      - name: cmake-language-server
        version: latest
        description: "CMake LSP"
      - name: diagnostic-languageserver
        version: latest
        description: "Generic diagnostic LSP"
      - name: docker-language-server
        version: latest
        description: "Docker LSP"
      - name: dotenv-linter
        version: latest
        description: ".env file linter"
      - name: gh-actions-language-server
        version: latest
        description: "GitHub Actions LSP"
      - name: golangci-lint
        version: latest
        description: "Go linter"
      - name: golangci-lint-langserver
        version: latest
        description: "Go linter LSP"
      - name: go-debug-adapter
        version: latest
        description: "Go debugger"
      - name: jinja-lsp
        version: latest
        description: "Jinja template LSP"
      - name: jq-lsp
        version: latest
        description: "jq LSP"
      - name: kube-linter
        version: latest
        description: "Kubernetes linter"
      - name: kulala-fmt
        version: latest
        description: "HTTP formatter"
      - name: luacheck
        version: latest
        description: "Lua linter"
      - name: luaformatter
        version: latest
        description: "Lua formatter"
      - name: markdown-oxide
        version: latest
        description: "Markdown LSP"
      - name: nginx-language-server
        version: latest
        description: "Nginx LSP"
      - name: postgrestools
        version: latest
        description: "PostgreSQL tools"
      - name: systemd-language-server
        version: latest
        description: "Systemd LSP"
      - name: tree-sitter-cli
        version: latest
        description: "Tree-sitter CLI"
      - name: typos
        version: latest
        description: "Typo checker"
      - name: typos-lsp
        version: latest
        description: "Typo checker LSP"
      - name: vale-ls
        version: latest
        description: "Vale LSP"
      - name: vim-language-server
        version: latest
        description: "Vim LSP"

  architecture:
    # Native mise for primary system architecture
    native:
      binary: "mise"
      launchagent: "com.user.mise-update"

    # x64 variant - always installed on ARM64 for Node.js 14 compatibility
    x64_variant:
      install_on_arm64: true
      arch: "x64"
      binary: "mise-x64"
      description: "for Node.js 14 compatibility"
      launchagent: "com.user.mise-x64-update"

  # Scheduling configuration for LaunchAgents
  schedule:
    native:
      hour: 9
      minute: 15
    x64_variant:
      hour: 9
      minute: 0
