macos_services:
  # Window management services
  - name: aerospace
    type: brew_service
    action: start
    description: "Aerospace window manager service"
    condition: always

  - name: borders
    type: brew_service
    action: stop
    description: "Window border service (jankyborders)"
    condition: always

  # System services
  - name: yabai
    type: brew_service
    action: stop
    description: "Alternative window manager (disabled)"
    condition: never

# Development services (excluded from auto-management)
excluded_services:
  - postgresql
  - redis
  - mysql
  - php
  - kubewall
  - unbound

# Application configurations
app_configs:
  aerospace:
    # Aerospace window manager configuration
    style: "tiling"
    gaps: 8
    border_width: 2
    focus_follows_mouse: false
    mouse_follows_focus: false
    
    # Workspace configuration
    workspaces:
      - name: "1"
        monitor: "main"
      - name: "2"
        monitor: "main"
      - name: "3"
        monitor: "main"
      - name: "4"
        monitor: "main"
      - name: "5"
        monitor: "main"

    # Key bindings
    keybindings:
      mod: "alt"
      focus_left: "h"
      focus_down: "j"
      focus_up: "k"
      focus_right: "l"
      move_left: "shift-h"
      move_down: "shift-j"
      move_up: "shift-k"
      move_right: "shift-l"

  jankyborders:
    # Window border configuration
    style: "round"
    width: 6.0
    hidpi: true
    active_color: "0xff94e2d5"
    inactive_color: "0xff45475a"
    background_color: "0xff1e1e2e"

    # Border behavior
    blur_radius: 5.0
    order: "above"
    ax_focus: true

  font_management:
    # Font management configuration
    auto_install: true
    preferred_fonts:
      - "JetBrains Mono Nerd Font"
      - "Fira Code Nerd Font"
      - "Hack Nerd Font"
      - "Source Code Pro"

    # Font categories
    categories:
      programming:
        - "JetBrains Mono Nerd Font"
        - "Fira Code Nerd Font"
        - "Hack Nerd Font"
      system:
        - "SF Pro Display"
        - "SF Pro Text"
      design:
        - "Inter"
        - "Roboto"
