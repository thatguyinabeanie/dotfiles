macos_services:
  # Window management services
  - name: aerospace
    type: brew_service
    action: start
    description: "Aerospace window manager service"
    condition: always

  # borders (jankyborders) — removed from service management; config in dot_config/borders/
  # is retained for manual use. Launch via `borders` command when needed.

# Development services (excluded from auto-management)
excluded_services:
  - postgresql
  - redis
  - mysql
  - php
  - kubewall
  - unbound

# Application configurations
app_configs:
  jankyborders:
    # Window border configuration
    style: "round"
    width: 6.0
    hidpi: true
    active_color: "0xff94e2d5"
    inactive_color: "0xff45475a"
    background_color: "0xff1e1e2e"

    # Border behavior
    blur_radius: 5.0
    order: "above"
    ax_focus: true

  font_management:
    # Font management configuration
    auto_install: true
    preferred_fonts:
      - "JetBrains Mono Nerd Font"
      - "Fira Code Nerd Font"
      - "Hack Nerd Font"
      - "Source Code Pro"

    # Font categories
    categories:
      programming:
        - "JetBrains Mono Nerd Font"
        - "Fira Code Nerd Font"
        - "Hack Nerd Font"
      system:
        - "SF Pro Display"
        - "SF Pro Text"
      design:
        - "Inter"
        - "Roboto"
