  #   category: infrastructure

  # Documentation tools
  - name: marp-cli
    install_via: mise
    runtime: node
    version: latest
    description: "Markdown presentation tool"
    category: documentation

  - name: mdbook
    install_via: mise
    runtime: native
    version: latest
    description: "Book generator from Markdown"
