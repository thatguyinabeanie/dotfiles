    category: documentation

  - name: mactex-no-gui
    install_via: brew_cask
    runtime: native
    version: latest
    description: "LaTeX distribution for macOS"
    category: documentation

  # Programming language runtimes
  - name: node
    install_via: mise
    runtime: native
    version: "22"
    description: "Node.js JavaScript runtime"
    category: runtime

  - name: python
    install_via: mise
    runtime: native
    version: latest
    description: "Python programming language"
    category: runtime

  - name: ruby
    install_via: mise
    runtime: native
    version: "3.2.7"
    description: "Ruby programming language"
    category: runtime

  - name: go
    install_via: mise
    runtime: native
    version: latest
    description: "Go programming language"
    category: runtime

  - name: rust
    install_via: mise
    runtime: native
    version: latest
    description: "Rust programming language"
    category: runtime

  - name: zig
    install_via: mise
    runtime: native
    version: latest
    description: "Zig systems programming language"
    category: runtime

  - name: java
    install_via: mise
    runtime: native
    version: "zulu-8"
    description: "Java runtime (Zulu JDK 8)"
    category: runtime

  - name: elixir
    install_via: mise
    runtime: native
    version: latest
    description: "Elixir programming language"
    category: runtime

  - name: erlang
    install_via: mise
    runtime: native
    version: latest
    description: "Erlang runtime (Elixir dependency)"
    category: runtime

  - name: julia
    install_via: mise
    runtime: native
    version: "1.11.6"
    description: "Julia programming language for scientific computing"
    category: runtime

  # Package managers
  - name: pnpm
    install_via: mise
    runtime: node
    version: latest
    description: "Fast Node.js package manager"
    category: package_manager

  - name: yarn
    install_via: mise
    runtime: node
    version: latest
    description: "Node.js package manager"
    category: package_manager

  - name: bun
    install_via: mise
    runtime: native
    version: latest
    description: "Fast JavaScript runtime"
    category: package_manager

  - name: deno
    install_via: mise
    runtime: native
    version: latest
    description: "Modern JavaScript runtime"
    category: package_manager

  - name: pipx
    install_via: brew
    runtime: native
    version: latest
    description: "Install and run python applications in isolated environments"
    category: package_manager

  - name: uv
    install_via: mise
    runtime: native
    version: latest
    description: "Fast Python package installer and resolver"
    category: package_manager

  # Build tools
  - name: gradle
    install_via: mise
    runtime: java
    version: latest
    description: "Build automation tool"
    category: build

  - name: maven
    install_via: mise
    runtime: java
    version: latest
    description: "Java build tool"
    category: build

  - name: cmake
    install_via: brew
    runtime: native
    version: latest
    description: "Cross-platform build system"
    category: build

  - name: make
    install_via: brew
    runtime: native
    version: latest
    description: "Build automation tool"
    category: build

  # Terminal and shell tools
  - name: tmux
    install_via: brew
    runtime: native
    version: latest
    description: "Terminal multiplexer"
    category: terminal

  - name: zellij
    install_via: brew
    runtime: native
    version: latest
    description: "Terminal workspace"
    category: terminal

  - name: starship
    install_via: brew
    runtime: native
    version: latest
    description: "Cross-shell prompt"
    category: terminal

  - name: fzf
    install_via: brew
    runtime: native
    version: latest
    description: "Fuzzy finder"
    category: terminal

  - name: zoxide
    install_via: brew
    runtime: native
    version: latest
    description: "Smart cd command"
    category: terminal

  # Editors and IDEs
  - name: neovim
    install_via: brew
    runtime: native
    version: latest
    description: "Modern Vim-based editor"
    category: editor

  - name: helix
    install_via: brew
    runtime: native
    version: latest
    description: "Modern modal editor"
    category: editor

  # Language servers and development tools
  - name: markdown-oxide
    install_via: cargo
    runtime: rust
    version: latest
    description: "Markdown language server"
    category: lsp
    install_command: "cargo install --locked --git https://github.com/Feel-ix-343/markdown-oxide.git markdown-oxide"

  - name: typos-lsp
    install_via: cargo
    runtime: rust
    version: latest
    description: "Typo checker language server"
    category: lsp
    install_command: "cargo install --git https://github.com/tekumara/typos-lsp typos-lsp"

   # Curl-based installations
  - name: mise
    install_via: curl
    runtime: native
    install_script: "curl https://mise.run | sh"
    description: "Tool version manager"
    category: system

# AI Agents and Assistants
agents:
  - name: "opencode-ai"
    install_via: npm
    runtime: node
    version: "latest"
    description: "OpenCode AI"
    category: code_assistant

  - name: "@augmentcode/auggie"
    install_via: bun
    runtime: native
    version: latest
    description: "Augment Code CLI"
    category: code_assistant

  - name: "@google/gemini-cli"
    install_via: bun
    runtime: native
    version: latest
    description: "Google Gemini Cli Coding Agent"
    category: code_assistant

  # - name: "@openai/codex"
  #   install_via: npm
  #   runtime: node
  #   version: latest
  #   description: "OpenAI Codex CLI"
  #   category: code_assistant

  - name: "@anthropic-ai/claude-code"
    install_via: bun
    runtime: native
    version: latest
    description: "Claude Code Commands Manager"
    category: code_assistant

  # GUI AI Applications (macOS casks)
  - name: cursor
    install_via: brew_cask
    runtime: native
    description: "AI-powered code editor"
    category: ide
    macos_only: true

  # Terminal-based AI tools
  - name: charmbracelet/tap/mods
    install_via: brew
    runtime: native
    description: "AI on the command line"
    category: terminal

# Model Context Protocol (MCP) Servers
mcp_servers:
  # Development and deployment MCP servers
  - name: "vercel"
    install_via: bun
    runtime: node
    version: latest
    description: "Vercel CLI tool with MCP capabilities"
    purpose: "Vercel deployment and management"
    dependencies: []
