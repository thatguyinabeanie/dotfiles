dev_tools:
  # ============================================================
  # DEFAULT PROFILE — Core tools, always installed
  # ============================================================

  # Shell essentials
  - name:  coreutils
    installer: [brew]
  - name: zsh
    installer: [brew]
  - name: starship
    installer: [brew]
  - name: fzf
    installer: [mise]
  - name: zoxide
    installer: [mise]
  - name: carapace
    installer: [brew]
  - name: zsh-syntax-highlighting
    installer: [brew]
  - name: zsh-autosuggestions
    installer: [brew]
  - name: zsh-completions
    installer: [brew]
  - name: atuin
    installer: [brew]

  # File and directory tools
  - name: eza
    installer: [mise]
  - name: fd
    installer: [mise]
  - name: ripgrep
    installer: [mise]
  - name: bat
    installer: [mise]
  - name: dust
    installer: [brew]
  - name: yazi
    installer: [mise]
    description: "Terminal file manager"
  - name: ouch
    installer: [brew]
    description: "Painless compression/decompression - handles tar, gzip, zip, etc."
  - name: watchexec
    installer: [brew]
    description: "Execute commands on file changes - Rust alternative to entr/fswatch"

  # Data processing
  - name: jq
    installer: [mise]
  - name: jaq
    installer: [brew]
    description: "Rust drop-in replacement for jq with improved performance"
  - name: yq
    installer: [mise]

  # Git tools
  - name: gh
    installer: [brew]
  - name: delta
    installer: [mise]
  - name: lefthook
    installer: [mise]
  - name: lazygit
    installer: [mise]

  # Editors
  - name: neovim
    installer: [mise]
    version: "0.12"
  - name: opencode
    installer: [brew]
    description: "AI coding agent for the terminal"

  # Terminal multiplexer
  - name: tmux
    installer: [brew]
  - name: sesh
    installer: [brew]
    description: "Smart session manager for tmux with zoxide integration"
  - name: tmuxinator
    installer: [brew]
    description: "Manage complex tmux session layouts via YAML templates"

  # System monitoring
  - name: btop
    installer: [brew]
  - name: fastfetch
    installer: [mise]
  - name: tty-clock
    installer: [brew]
    description: "Digital clock for the terminal"

  # Task management
  - name: task
    installer: [brew]
    description: "Taskwarrior - feature-rich console todo list manager"
  - name: taskwarrior-tui
    installer: [brew]
    description: "Interactive TUI frontend for Taskwarrior"

  # Core language runtimes
  - name: node
    installer: [mise]
    version: "24"
  - name: python
    installer: [mise]
  - name: go
    installer: [mise]
  - name: rust
    installer: [mise]
    version: nightly

  # Core package managers
  - name: pnpm
    mise_name: "github:pnpm/pnpm"
    installer: [mise]
  - name: npm
    installer: [mise]
  - name: pipx
    installer: [brew]
  - name: uv
    installer: [brew]
  - name: cargo-binstall
    installer: [cargo]
  - name: sccache
    installer: [cargo]
    description: "Shared compilation cache for Rust/C/C++ - speeds up rebuilds"
  - name: cargo-nextest
    installer: [cargo]
    description: "Next-generation Rust test runner - faster than cargo test"

  # Build essentials
  - name: just
    installer: [mise]
    description: "Rust command runner - simpler alternative to make"
  - name: cmake
    installer: [brew]
  - name: make
    installer: [brew]
  - name: pkg-config
    installer: [brew]
    description: "Required for building PostgreSQL and other packages"
  - name: lua
    installer: [brew]
  - name: luarocks
    installer: [brew]

  # Dotfiles and tooling management
  - name: chezmoi
    installer: [brew]
  - name: mise
    installer: [curl]
  - name: zinit
    installer: [curl]

  # Markdown/docs
  - name: glow
    installer: [mise]
    description: "Render markdown beautifully in the terminal"
  - name: mods
    installer: [brew]
    description: "AI-powered terminal LLM client (charmbracelet)"

  # Image/graphics (required by neovim plugins)
  - name: resvg
    installer: [brew]
    description: "SVG rendering library for Mermaid diagrams in Neovim"
  - name: imagemagick
    installer: [brew]
    description: "Image manipulation library required by image.nvim"
  - name: ghostscript
    installer: [brew]
    description: "Type1 fonts and PS/PDF rendering used by ImageMagick for font support"
  - name: "@mermaid-js/mermaid-cli"
    installer: [npm]
    description: "Mermaid CLI for rendering diagrams to images"

  # Security
  - name: 1password-cli
    installer: [mise]

  # ============================================================
  # EDITORS PROFILE — Extra editors, terminals, and shell tools
  # ============================================================
  - name: helix
    installer: [mise]
    profiles: [editors]
  - name: zellij
    installer: [mise]
    profiles: [editors]
  - name: fish
    installer: [brew]
    profiles: [editors]
  - name: television
    installer: [brew]
    description: "TUI fuzzy finder"
    profiles: [editors]

  # ============================================================
  # INFRA PROFILE — Cloud, containers, and infrastructure
  # ============================================================
  - name: awscli
    installer: [brew]
    profiles: [infra]
  - name: circleci
    installer: [brew]
    profiles: [infra]
  - name: terraform
    installer: [mise]
    profiles: [infra]
  - name: kubectl
    installer: [mise]
    profiles: [infra]
  - name: helm
    installer: [mise]
    profiles: [infra]
  - name: k9s
    installer: [mise]
    profiles: [infra]
  - name: dive
    installer: [mise]
    profiles: [infra]
  - name: okta-aws-cli
    installer: [brew]
    profiles: [infra]
  - name: lazydocker
    installer: [mise]
    profiles: [infra]
  - name: acli
    installer: [brew]
    description: "Atlassian CLI for Jira, Confluence, etc."
    profiles: [infra]

  # ============================================================
  # DATABASES PROFILE — Database runtimes
  # ============================================================
  - name: postgres
    installer: [mise]
    version: "16"
    description: "PostgreSQL database with psql client"
    profiles: [databases]
  - name: mysql
    installer: [mise]
    description: "MySQL database"
    profiles: [databases]

  # ============================================================
  # LANGUAGES PROFILE — Additional language runtimes
  # ============================================================
  - name: ruby
    installer: [mise]
    version: "3.4.9"
    profiles: [languages]
  - name: zig
    installer: [mise]
    profiles: [languages]
  - name: java
    installer: [mise]
    version: "zulu-8.92.0.21"
    profiles: [languages]
  - name: elixir
    installer: [mise]
    profiles: [languages]
  - name: erlang
    installer: [mise]
    profiles: [languages]
  - name: julia
    installer: [mise]
    version: "1.12.5"
    profiles: [languages]
  - name: deno
    installer: [mise]
    profiles: [languages]
  - name: bun
    installer: [mise]
    description: "Fast JavaScript runtime and package manager"
  - name: yarn
    installer: [mise]
    profiles: [languages]
  - name: gradle
    installer: [mise]
    profiles: [languages]
  - name: maven
    installer: [mise]
    profiles: [languages]

  # ============================================================
  # PUBLISHING PROFILE — Document and book publishing
  # ============================================================
  - name: mdbook
    installer: [mise]
    profiles: [publishing]
  - name: pandoc
    installer: [brew]
    profiles: [publishing]

  # ============================================================
  # EXTRAS PROFILE — Nice-to-have CLI tools
  # ============================================================
  - name: bottom
    installer: [mise]
    profiles: [extras]
  - name: glances
    installer: [brew]
    profiles: [extras]
  - name: procs
    installer: [brew]
    profiles: [extras]
  - name: navi
    installer: [brew]
    profiles: [extras]
  - name: sd
    installer: [brew]
    profiles: [extras]
  - name: tealdeer
    installer: [brew]
    profiles: [extras]
  - name: gdu
    installer: [brew]
    profiles: [extras]
  - name: hyperfine
    installer: [mise]
    profiles: [extras]
  - name: gitsign
    installer: [mise]
    profiles: [extras]
  - name: gitui
    installer: [mise]
    profiles: [extras]
  - name: lazyjournal
    installer: [mise]
    profiles: [extras]
  - name: tig
    installer: [brew]
    profiles: [extras]
  - name: pokeget
    installer: [cargo]
    description: "Pokeget"
    profiles: [extras]
  - name: difftastic
    installer: [brew]
    description: "Syntax-aware structural diff that understands code"
    profiles: [extras]
  - name: topgrade
    installer: [brew]
    description: "Upgrade all tools across package managers in one command"
    profiles: [extras]
  - name: choose
    installer: [brew]
    description: "Human-friendly cut/awk alternative for column extraction"
    profiles: [extras]
  - name: xh
    installer: [brew]
    description: "Rust HTTP client with colorized output - faster httpie"
    profiles: [extras]
  - name: fend
    installer: [brew]
    description: "Arbitrary-precision unit-aware calculator"
    profiles: [extras]
  - name: tokei
    installer: [brew]
    description: "Count lines of code by language - fast Rust alternative to cloc"
    profiles: [extras]
  - name: tailspin
    installer: [brew]
    description: "Log file highlighter for streaming logs"
    profiles: [extras]

# NOTE: AI agents and MCP servers are now managed in separate files:
# - .chezmoidata/agents.yaml
# - .chezmoidata/mcp.yaml
