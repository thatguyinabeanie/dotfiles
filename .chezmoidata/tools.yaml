dev_tools:
  # System monitoring and performance
  - name: bottom
    install_via: mise
    runtime: native
    version: latest
    description: "System monitor (htop alternative)"
    category: system

  - name: btop
    install_via: brew
    runtime: native
    version: latest
    description: "Resource monitor"
    category: system

  - name: fastfetch
    install_via: mise
    runtime: native
    version: latest
    description: "System information tool"
    category: system

  - name: glances
    install_via: brew
    runtime: native
    version: latest
    description: "System monitoring tool"
    category: system

  - name: procs
    install_via: brew
    runtime: native
    version: latest
    description: "Modern ps replacement"
    category: system

  # File and directory tools
  - name: eza
    install_via: brew
