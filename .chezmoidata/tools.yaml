dev_tools:
  # ============================================================
  # DEFAULT PROFILE — Core tools, always installed
  # ============================================================

  # Shell essentials
  - name: zsh
    installer: [brew]
  - name: starship
    installer: [brew]
  - name: fzf
    installer: [mise]
  - name: zoxide
    installer: [mise]
  - name: carapace
    installer: [brew]
  - name: zsh-syntax-highlighting
    installer: [brew]
  - name: zsh-autosuggestions
    installer: [brew]
  - name: zsh-completions
    installer: [brew]
  - name: atuin
    installer: [brew]

  # File and directory tools
  - name: eza
    installer: [mise]
  - name: fd
    installer: [mise]
  - name: ripgrep
    installer: [mise]
  - name: bat
    installer: [mise]
  - name: tree
    installer: [brew]
  - name: dust
    installer: [brew]
  - name: yazi
    installer: [mise]
    description: "Terminal file manager"

  # Data processing
  - name: jq
    installer: [mise]
  - name: yq
    installer: [mise]

  # Git tools
  - name: gh
    installer: [brew]
  - name: delta
    installer: [mise]
  - name: lefthook
    installer: [mise]
  - name: lazygit
    installer: [mise]

  # Editors
  - name: neovim
    installer: [mise]
    version: "0.11"
    extra_versions: ["0.12"]

  # Terminal multiplexer
  - name: tmux
    installer: [brew]
  - name: sesh
    installer: [brew]
    description: "Smart session manager for tmux with zoxide integration"

  # System monitoring
  - name: btop
    installer: [brew]
  - name: fastfetch
    installer: [mise]

  # Core language runtimes
  - name: node
    installer: [mise]
    version: "24"
  - name: python
    installer: [mise]
  - name: go
    installer: [mise]
  - name: rust
    installer: [mise]
    version: nightly

  # Core package managers
  - name: pnpm
    installer: [mise]
  - name: npm
    installer: [mise]
  - name: pipx
    installer: [brew]
  - name: uv
    installer: [brew]
  - name: cargo-binstall
    installer: [cargo]

  # Build essentials
  - name: cmake
    installer: [brew]
  - name: make
    installer: [brew]
  - name: pkg-config
    installer: [brew]
    description: "Required for building PostgreSQL and other packages"
  - name: lua
    installer: [brew]
  - name: luarocks
    installer: [brew]

  # Dotfiles and tooling management
  - name: chezmoi
    installer: [brew]
  - name: mise
    installer: [curl]
  - name: zinit
    installer: [curl]

  # Markdown/docs
  - name: glow
    installer: [brew]
    description: "Render markdown beautifully in the terminal"

  # Image/graphics (required by neovim plugins)
  - name: resvg
    installer: [brew]
    description: "SVG rendering library for Mermaid diagrams in Neovim"
  - name: imagemagick
    installer: [brew]
    description: "Image manipulation library required by image.nvim"
  - name: "@mermaid-js/mermaid-cli"
    installer: [npm]
    description: "Mermaid CLI for rendering diagrams to images"

  # Security
  - name: 1password-cli
    installer: [mise]

  # ============================================================
  # EDITORS PROFILE — Extra editors, terminals, and shell tools
  # ============================================================
  - name: helix
    installer: [mise]
    profiles: [editors]
  - name: zellij
    installer: [mise]
    profiles: [editors]
  - name: fish
    installer: [brew]
    profiles: [editors]
  - name: television
    installer: [brew]
    description: "TUI fuzzy finder"
    profiles: [editors]

  # ============================================================
  # INFRA PROFILE — Cloud, containers, and infrastructure
  # ============================================================
  - name: awscli
    installer: [brew]
    profiles: [infra]
  - name: circleci
    installer: [brew]
    profiles: [infra]
  - name: terraform
    installer: [mise]
    profiles: [infra]
  - name: kubectl
    installer: [mise]
    profiles: [infra]
  - name: helm
    installer: [mise]
    profiles: [infra]
  - name: k9s
    installer: [mise]
    profiles: [infra]
  - name: dive
    installer: [mise]
    profiles: [infra]
  - name: okta-aws-cli
    installer: [brew]
    profiles: [infra]
  - name: lazydocker
    installer: [mise]
    profiles: [infra]
  - name: acli
    installer: [brew]
    description: "Atlassian CLI for Jira, Confluence, etc."
    profiles: [infra]

  # ============================================================
  # DATABASES PROFILE — Database runtimes
  # ============================================================
  - name: postgres
    installer: [mise]
    description: "PostgreSQL database with psql client"
    profiles: [databases]
  - name: mysql
    installer: [mise]
    description: "MySQL database"
    profiles: [databases]

  # ============================================================
  # LANGUAGES PROFILE — Additional language runtimes
  # ============================================================
  - name: ruby
    installer: [mise]
    version: "3.4.9"
    profiles: [languages]
  - name: zig
    installer: [mise]
    profiles: [languages]
  - name: java
    installer: [mise]
    version: "zulu-8"
    profiles: [languages]
  - name: elixir
    installer: [mise]
    profiles: [languages]
  - name: erlang
    installer: [mise]
    profiles: [languages]
  - name: julia
    installer: [mise]
    version: "1.12.5"
    profiles: [languages]
  - name: deno
    installer: [mise]
    profiles: [languages]
  - name: yarn
    installer: [mise]
    profiles: [languages]
  - name: gradle
    installer: [mise]
    profiles: [languages]
  - name: maven
    installer: [mise]
    profiles: [languages]

  # ============================================================
  # PUBLISHING PROFILE — Document and book publishing
  # ============================================================
  - name: mdbook
    installer: [mise]
    profiles: [publishing]
  - name: pandoc
    installer: [brew]
    profiles: [publishing]

  # ============================================================
  # EXTRAS PROFILE — Nice-to-have CLI tools
  # ============================================================
  - name: bottom
    installer: [mise]
    profiles: [extras]
  - name: glances
    installer: [brew]
    profiles: [extras]
  - name: procs
    installer: [brew]
    profiles: [extras]
  - name: navi
    installer: [brew]
    profiles: [extras]
  - name: sd
    installer: [brew]
    profiles: [extras]
  - name: tealdeer
    installer: [brew]
    profiles: [extras]
  - name: ncdu
    installer: [brew]
    profiles: [extras]
  - name: gdu
    installer: [brew]
    profiles: [extras]
  - name: jaq
    installer: [brew]
    profiles: [extras]
  - name: hyperfine
    installer: [mise]
    profiles: [extras]
  - name: gitsign
    installer: [mise]
    profiles: [extras]
  - name: gitui
    installer: [mise]
    profiles: [extras]
  - name: lazyjournal
    installer: [mise]
    profiles: [extras]
  - name: tig
    installer: [brew]
    profiles: [extras]
  - name: pokeget
    installer: [cargo]
    description: "Pokeget"
    profiles: [extras]

# NOTE: AI agents and MCP servers are now managed in separate files:
# - .chezmoidata/agents.yaml
# - .chezmoidata/mcp.yaml
