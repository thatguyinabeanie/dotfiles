# 1Password configuration for both personal and work environments
# This configuration supports two authentication methods:
# - Personal: 1Password Desktop App (interactive authentication)
# - Work: 1Password Service Account (token-based, limited access)

onepassword:
  # Personal environment settings
  personal:
    # Uses 1Password Desktop App
    auth_method: "app"
    # SSH agent configuration
    ssh_agent:
      enabled: true
      socket_path: "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
    # Vaults accessible in personal environment
    vaults:
      - name: "Private"
        access: "full"
      - name: "Tech - Dev"
        access: "full"

  # Work environment settings
  work:
    # Uses service account for limited, non-interactive access
    auth_method: "service_account"
    # Service account token location
    # Options:
    # 1. Environment variable (recommended): Set OP_SERVICE_ACCOUNT_TOKEN
    # 2. File-based: Store in ~/.config/op/service-account-token
    token_source: "env"  # or "file"
    token_file: "$HOME/.config/op/service-account-token"

    # SSH configuration for work
    ssh:
      # Use traditional SSH keys instead of 1Password SSH agent
      use_traditional_keys: true
      key_path: "$HOME/.ssh/id_ed25519"

    # Secrets accessible via service account (limited scope)
    # Add items here that you need to access on your work laptop
    secrets: []
    # Example: API keys
    # - vault: "Work Secrets"
    #   item: "GitHub API Token"
    #   field: "credential"
    #   env_var: "GITHUB_TOKEN"
    #
    # Example: SSH key (if needed)
    # - vault: "Work Secrets"
    #   item: "Work SSH Key"
    #   field: "private key"
    #   env_var: "WORK_SSH_KEY"
