# Brew Services Configuration
# Services that should always be running
# These will be started if stopped, restarted if running

services:
  # macOS Enhancements (currently installed)
  - name: "sketchybar"
    description: "Custom macOS menu bar"
    action: "restart"

  - name: "borders"
    description: "Window borders for macOS"
    action: "start"

  - name: "redis"
    disabled: true
    description: "Redis in-memory data store"
    action: "start"

