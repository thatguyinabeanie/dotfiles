env_shared:
  # Simple string variables (direct assignment)
  variables:
    GHOSTTY_AUTO_TMUX: true
    MANAGE_BREW_SERVICES: "true"
    INSTALL_GH_EXTENSIONS: false
    EDITOR: "nvim"
    VISUAL: "nvim"
    LDFLAGS: "-L/opt/homebrew/opt/openssl@3/lib"
    CPPFLAGS: "-I/opt/homebrew/opt/openssl@3/include"
    CARAPACE_BRIDGES: "zsh,bash,inshellisense"
    XDG_DATA_DIRS: ""
    XDG_CONFIG_DIRS: ""

  # Template variables (evaluated at chezmoi time)
  template_variables:
    BAT_THEME: "Catppuccin {{ title .CATPPUCCIN_FLAVOR }}"
    WORK_ENVIRONMENT: "{{ .WORK_ENVIRONMENT }}"
    CHEZMOI_INTERACTIVE: "{{ if .INTERACTIVE }}1{{ else }}0{{ end }}"

  # Shell paths (platform-specific)
  shell_paths:
    zsh: '{{ if eq .chezmoi.os "darwin" }}/opt/homebrew/bin/zsh{{ else }}/bin/zsh{{ end }}'

  # Path construction variables
  path_variables:
    # XDG Base directories
    XDG_CONFIG_HOME:
      base: "$HOME"
      path: ".config"
    XDG_DATA_HOME:
      base: "$HOME"
      path: ".local/share"
    XDG_STATE_HOME:
      base: "$HOME"
      path: ".local/state"
    XDG_CACHE_HOME:
      base: "$HOME"
      path: ".cache"

  # Grouped path patterns
  path_groups:
    # XDG Config-based applications
    xdg_config_apps:
      base: "$XDG_CONFIG_HOME"
      paths:
        K9S_CONFIG_DIR: "k9s"
        STARSHIP_CONFIG: "starship/starship.toml"
        TMUX_CONFIG_DIR: "tmux"
        YAZI_CONFIG_DIR: "yazi"
        ZELLIJ_CONFIG_DIR: "zellij"

    # XDG Data-based applications
    xdg_data_apps:
      base: "$XDG_DATA_HOME"
      paths:
        MISE_DATA_DIR: "mise"
        CARGO_HOME: "cargo"
        RUSTUP_HOME: "rustup"
        GOPATH: "go"

    # XDG Cache-based applications
    xdg_cache_apps:
      base: "$XDG_CACHE_HOME"
      paths:
        MISE_CACHE_DIR: "mise"
        NODE_REPL_HISTORY: "node_repl_history"
        PYTHON_HISTORY: "python_history"

  # Development environment paths
  development_paths:
    # Language-specific paths
    languages:
      go:
        GOPATH: "$XDG_DATA_HOME/go"
        GOBIN: "$XDG_DATA_HOME/go/bin"
      rust:
        CARGO_HOME: "$XDG_DATA_HOME/cargo"
        RUSTUP_HOME: "$XDG_DATA_HOME/rustup"
      node:
        NPM_CONFIG_USERCONFIG: "$XDG_CONFIG_HOME/npm/npmrc"

        NODE_REPL_HISTORY: "$XDG_CACHE_HOME/node_repl_history"
      python:
        PYTHONSTARTUP: "$XDG_CONFIG_HOME/python/pythonrc"
        PYTHON_HISTORY: "$XDG_CACHE_HOME/python_history"

    # Tool-specific paths
    tools:
      mise:
        MISE_CONFIG_DIR: "$XDG_CONFIG_HOME/mise"
        MISE_DATA_DIR: "$XDG_DATA_HOME/mise"
        MISE_CACHE_DIR: "$XDG_CACHE_HOME/mise"
      docker:
        DOCKER_CONFIG: "$XDG_CONFIG_HOME/docker"

  # Shell configuration
  shell_config:
    # History settings
    history:
      HISTFILE: "$XDG_STATE_HOME/bash/history"
      HISTSIZE: 10000
      HISTFILESIZE: 20000
      HISTCONTROL: "ignoreboth:erasedups"

    # Completion settings
    completion:
      BASH_COMPLETION_USER_FILE: "$XDG_CONFIG_HOME/bash-completion/bash_completion"
      ZSH_COMPDUMP: "$XDG_CACHE_HOME/zsh/zcompdump-$ZSH_VERSION"

  # Application-specific settings
  app_settings:
    # Terminal applications
    terminal:
      BAT_CONFIG_PATH: "$XDG_CONFIG_HOME/bat/config"
      FZF_DEFAULT_OPTS: "--height 40% --layout=reverse --border"
      RIPGREP_CONFIG_PATH: "$XDG_CONFIG_HOME/ripgrep/config"

    # Development tools
    development:
      GIT_CONFIG_GLOBAL: "$XDG_CONFIG_HOME/git/config"
      LESSHISTFILE: "$XDG_CACHE_HOME/less/history"
      SQLITE_HISTORY: "$XDG_CACHE_HOME/sqlite_history"

    # Security and privacy
    security:
      GNUPGHOME: "$XDG_DATA_HOME/gnupg"
      PASSWORD_STORE_DIR: "$XDG_DATA_HOME/pass"

  # PATH entries (common development paths)
  # Priority order: local bins → mise (version managers) → system → homebrew
  env_paths:
    path:
      - "$HOME/.cache/.bun/bin"
      - "$HOME/.local/bin"
      - "$HOME/.cargo/bin"
      - "$XDG_DATA_HOME/mise/shims"
      - "/usr/local/bin"
      - "/opt/homebrew/bin"
      - "/opt/homebrew/sbin"

  # Command-based variables (computed at runtime)
  command_variables: {}

  # Derived path variables (computed from other variables)
  derived_path_variables: {}

  # Shared applications for all environments
  applications:
    # Shared applications for all environments
    - name: aerospace
      install_via: brew_cask
      category: system
      description: "Tiling window manager for macOS"
    - name: cursor
      install_via: brew_cask
      category: editor
      description: "AI-powered code editor"
    - name: cyberduck
      install_via: brew_cask
      category: file_transfer
      description: "FTP, SFTP, WebDAV, S3, & OpenStack Swift browser"
    - name: disk-inventory-x
      install_via: brew_cask
      category: system
      description: "Disk usage utility"
    - name: espanso
      install_via: brew_cask
      category: productivity
      description: "Cross-platform text expander"
    - name: firefox
      install_via: brew_cask
      category: browser
      description: "Mozilla Firefox browser"
    - name: ghostty
      install_via: brew_cask
      category: terminal
      description: "GPU-accelerated terminal emulator"
    - name: google-chrome
      install_via: brew_cask
      category: browser
      description: "Google Chrome browser"
    - name: karabiner-elements
      install_via: brew_cask
      category: system
      description: "Keyboard customizer for macOS"
    - name: keka
      install_via: brew_cask
      category: utility
      description: "File archiver for macOS"
    - name: kindaVim
      install_via: brew_cask
      category: productivity
      description: "Vim-like keybindings for macOS"
    - name: kitty
      install_via: brew_cask
      category: terminal
      description: "GPU-based terminal emulator"
    - name: nightfall
      install_via: brew_cask
      category: system
      description: "Menu bar utility to toggle dark mode"
    - name: obsidian
      install_via: brew_cask
      category: productivity
      description: "Knowledge base and note-taking app"
    - name: opera
      install_via: brew_cask
      category: browser
      description: "Opera web browser"
    - name: postman
      install_via: brew_cask
      category: development
      description: "API platform for building and using APIs"
    - name: raycast
      install_via: brew_cask
      description: "AI-powered launcher and productivity tool"
      category: productivity
      macos_only: true
    - name: slack
      install_via: brew_cask
      category: communication
      description: "Team collaboration"
    - name: sf-symbols
      install_via: brew_cask
      category: development
      description: "Apple's library of iconography"
    - name: visual-studio-code@insiders
      install_via: brew_cask
      category: editor
      description: "Visual Studio Code Insiders edition"
    - name: zed
      install_via: brew_cask
      category: editor
      description: "High-performance, multiplayer code editor"
