language_servers:
  # JavaScript/TypeScript ecosystem
  - name: tsserver
    mason_name: typescript-language-server
    lspconfig_name: ts_ls
    languages: [typescript, javascript, javascriptreact, typescriptreact]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  # vscode-eslint-language-server removed - doesn't exist on npm, eslint_d covers this functionality

  # Systems languages
  - name: rust-analyzer
    mason_name: rust-analyzer
    lspconfig_name: rust_analyzer
    languages: [rust]
    install_via: mise
    provides_formatting: true
    mason_ensure_installed: true

  - name: gopls
    lspconfig_name: gopls
    languages: [go]
    install_via: go
    provides_formatting: true
    install_command: "golang.org/x/tools/gopls@latest"
    mason_ensure_installed: true

  - name: zls
    lspconfig_name: zls
    languages: [zig]
    install_via: brew
    provides_formatting: true
    mason_ensure_installed: true

  # Scripting languages
  - name: bashls
    mason_name: bash-language-server
    lspconfig_name: bashls
    languages: [bash, sh, zsh]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  - name: lua_ls
    mason_name: lua-language-server
    lspconfig_name: lua_ls
    languages: [lua]
    install_via: mise
    provides_formatting: true
    mason_ensure_installed: true

  - name: ruby_lsp
    mason_name: ruby-lsp
    lspconfig_name: ruby_lsp
    languages: [ruby]
    install_via: gem
    provides_formatting: false
    mason_ensure_installed: true

  - name: pyright
    lspconfig_name: pyright
    languages: [python]
    install_via: brew
    provides_formatting: false
    mason_ensure_installed: true

  # Web technologies
  - name: cssls
    mason_name: css-lsp
    lspconfig_name: cssls
    languages: [css, scss, sass]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  - name: html
    mason_name: html-lsp
    lspconfig_name: html
    languages: [html]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  - name: jsonls
    mason_name: json-lsp
    lspconfig_name: jsonls
    languages: [json, jsonc]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  - name: yamlls
    mason_name: yamlls
    lspconfig_name: yamlls
    languages: [yaml]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  # Documentation and markup
  - name: marksman
    lspconfig_name: marksman
    languages: [markdown]
    install_via: mise
    provides_formatting: false
    mason_ensure_installed: true

  - name: markdown-oxide
    mason_name: markdown-oxide
    lspconfig_name: markdown_oxide
    languages: [markdown]
    install_via: cargo
    provides_formatting: false
    install_command: "cargo install --locked --git https://github.com/Feel-ix-343/markdown-oxide.git markdown-oxide"
    mason_ensure_installed: true

  # vale-ls removed - doesn't support go install, vale already available via brew

  # Infrastructure and DevOps
  - name: dockerls
    mason_name: dockerfile-language-server
    lspconfig_name: dockerls
    languages: [dockerfile]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  # nginx-language-server removed - doesn't exist on npm

  # systemd-language-server removed - Linux-specific, not needed on macOS

  # Specialized tools
  - name: cmake
    mason_name: cmake-language-server
    lspconfig_name: cmake
    languages: [cmake]
    install_via: pip
    provides_formatting: false
    mason_ensure_installed: true

  # jinja-lsp removed - package doesn't exist on pip

  # jq-lsp removed - doesn't exist on npm

  - name: vimls
    mason_name: vim-language-server
    lspconfig_name: vimls
    languages: [vim]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  # CI/CD and GitHub
  - name: gh_actions_lsp
    mason_name: gh-actions-language-server
    lspconfig_name: gh_actions_ls
    languages: [yaml]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  - name: copilot
    mason_name: copilot-language-server
    lspconfig_name: copilot
    languages: [text]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true

  # circleci-yaml-language-server removed - doesn't exist on npm

  # Linter language servers
  - name: golangcilsp
    mason_name: golangci-lint-langserver
    lspconfig_name: golangci_lint_ls
    languages: [go]
    install_via: go
    provides_formatting: false
    install_command: "github.com/nametake/golangci-lint-langserver@latest"
    mason_ensure_installed: true

  # typos-lsp moved to linters.yaml (primarily a linter)

  # Shell and fish
  - name: fish_lsp
    mason_name: fish-lsp
    lspconfig_name: fish_lsp
    languages: [fish]
    install_via: cargo
    provides_formatting: false
    mason_ensure_installed: true

  # Generic diagnostic server
  - name: diagnosticls
    mason_name: diagnostic-languageserver
    lspconfig_name: diagnosticls
    languages: [text]
    install_via: bun
    provides_formatting: false
    mason_ensure_installed: true
