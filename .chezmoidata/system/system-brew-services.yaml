system_brew_services:
  # Homebrew services that should be managed
  services:
    - name: "borders"
      command: "brew services"
      active: true
      action: "start"
      condition: "always"
  
  # Services to exclude from management
  excluded_services:
    - "postgresql"
    - "redis"
    - "mysql"
    - "php"
    - "kubewall"
    - "unbound"