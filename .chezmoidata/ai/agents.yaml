agents:
  - name: "opencode-ai"
    install_via: npm
    runtime: node
    version: "latest"
    description: "OpenCode AI"
    category: code_assistant

  - name: "@augmentcode/auggie"
    install_via: bun
    runtime: native
    version: latest
    description: "Augment Code CLI"
    category: code_assistant

  - name: "@google/gemini-cli"
    install_via: bun
    runtime: native
    version: latest
    description: "Google Gemini Cli Coding Agent"
    category: code_assistant

  # - name: "@openai/codex"
  #   install_via: npm
  #   runtime: node
  #   version: latest
  #   description: "OpenAI Codex CLI"
  #   category: code_assistant

  - name: "@anthropic-ai/claude-code"
    install_via: bun
    runtime: native
    version: latest
    description: "Claude Code Commands Manager"
    category: chat_assistant

  # GUI AI Applications (macOS casks)
  - name: cursor
    install_via: brew_cask
    runtime: native
    description: "AI-powered code editor"
    category: ide
    macos_only: true

  # Terminal-based AI tools
  - name: charmbracelet/tap/mods
    install_via: brew
    runtime: native
    description: "AI on the command line"
    category: terminal

