# .chezmoidata/github-copilot.yaml
# GitHub Copilot PRO has a global token limit of 128,000 tokens across all models
# This configuration includes individual model limits for proper OpenCode schema compliance
github-copilot:
  # Essential models available through GitHub Copilot with consistent limits
  models:
    # Claude models - most capable for complex tasks
    claude-3.5-sonnet:
      limit:
        context: 128000
        output: 8192
    claude-sonnet-4:
      limit:
        context: 128000
        output: 8192

    # GPT models - good general purpose models
    gpt-4o:
      limit:
        context: 128000
        output: 8192
    gpt-5:
      limit:
        context: 128000
        output: 8192

    # Google Gemini models - strong multimodal capabilities
    gemini-2.0-flash-001:
      limit:
        context: 128000
        output: 8192
    gemini-2.5-pro:
      limit:
        context: 128000
        output: 8192

    # OpenAI reasoning models - specialized for complex reasoning
    o3-mini:
      limit:
        context: 128000
        output: 8192
