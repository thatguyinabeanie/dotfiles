mcp_servers:
  # Core MCP servers (Node.js implementations) - verified to exist
  - name: "@modelcontextprotocol/server-filesystem"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP filesystem operations server"
    purpose: "File system operations and management"
    dependencies: []

  - name: "@modelcontextprotocol/server-memory"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP memory management server"
    purpose: "Persistent memory and context management"
    dependencies: []

  # Development and deployment MCP servers
  - name: "vercel"
    install_via: bun
    runtime: node
    version: "44.5.5"
    description: "Vercel CLI tool with MCP capabilities"
    purpose: "Vercel deployment and management"
    dependencies: []

  # API and web services MCP servers - verified to exist
  - name: "mcp-http-server"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP server for HTTP operations"
    purpose: "HTTP API testing and management"
    dependencies: []

  - name: "mcp-graphql-server"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP server for GraphQL operations"
    purpose: "GraphQL API management and testing"
    dependencies: []

  # Testing MCP servers - verified to exist
  - name: "mcp-test-server"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP server for test automation"
    purpose: "Test execution and management"
    dependencies: []

