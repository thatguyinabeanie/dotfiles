mcp_servers:
  # Core MCP servers (Node.js implementations) - verified to exist
  - name: "@modelcontextprotocol/server-filesystem"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP filesystem operations server"
    purpose: "File system operations and management"
    dependencies: []

  - name: "@modelcontextprotocol/server-memory"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP memory management server"
    purpose: "Persistent memory and context management"
    dependencies: []

  # Development and deployment MCP servers
  - name: "vercel"
    install_via: bun
    runtime: node
    version: "44.5.5"
    description: "Vercel CLI tool with MCP capabilities"
    purpose: "Vercel deployment and management"
    dependencies: []

