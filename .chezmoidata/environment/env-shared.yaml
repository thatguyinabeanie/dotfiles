env_shared:
  # Shared environment variables across all contexts
  
  # Simple string variables (direct assignment)
  variables:
    GHOSTTY_AUTO_TMUX: true
    MANAGE_BREW_SERVICES: "true"
    EDITOR: "nvim"
    VISUAL: "nvim"
    LDFLAGS: "-L/opt/homebrew/opt/openssl@3/lib"
    CPPFLAGS: "-I/opt/homebrew/opt/openssl@3/include"
    CARAPACE_BRIDGES: "zsh,bash,inshellisense"
    XDG_DATA_DIRS: ""
    XDG_CONFIG_DIRS: ""

  # Template variables (evaluated at chezmoi time)
  template_variables:
    BAT_THEME: "Catppuccin {{ title .CATPPUCCIN_FLAVOR }}"
    WORK_ENVIRONMENT: "{{ .WORK_ENVIRONMENT }}"
    CHEZMOI_INTERACTIVE: "{{ if .INTERACTIVE }}1{{ else }}0{{ end }}"

  # Shell paths (platform-specific)
  shell_paths:
    zsh: "{{ if eq .chezmoi.os \"darwin\" }}/opt/homebrew/bin/zsh{{ else }}/bin/zsh{{ end }}"
    nushell: "{{ if eq .chezmoi.os \"darwin\" }}/opt/homebrew/bin/nu{{ else }}/usr/bin/nu{{ end }}"

  # Path construction variables (shell handles the joining syntax)
  path_variables:
    # XDG Base directories (official XDG spec - no XDG_HOME)
    XDG_CONFIG_HOME:
      base: "$HOME"
      path: ".config"
    XDG_DATA_HOME:
      base: "$HOME"
      path: ".local/share"
    XDG_STATE_HOME:
      base: "$HOME"
      path: ".local/state"
    XDG_CACHE_HOME:
      base: "$HOME"
      path: ".cache"

  # Grouped path patterns for DRY configuration
  path_groups:
    # XDG Config-based applications
    xdg_config_apps:
      base: "$XDG_CONFIG_HOME"
      paths:
        NU_CONFIG_DIR: "nushell"
        K9S_CONFIG_DIR: "k9s"
        VSCODE_USER_DATA_DIR: "code"
        VSCODE_INSIDERS_USER_DATA_DIR: "code-insiders"

    # TMUX-related paths
    tmux_paths:
      base: "$XDG_CONFIG_HOME"
      paths:
        TMUX_CONFIG_DIR: "tmux"
        TMUX_PLUGIN_MANAGER_PATH: "tmux/plugins"
        TMUX_CONF: "tmux/tmux.conf"

    # Go-related paths
    go_paths:
      base: "$XDG_CONFIG_HOME"
      paths:
        GOPATH: "go"
        GOBIN: "go/bin"
        GOMODCACHE: "go/pkg/mod"

    # Single-path variables
    single_paths:
      base: "$XDG_CONFIG_HOME"
      paths:
        STARSHIP_CONFIG: "starship/starship.toml"
        STARSHIP_CONFIG_DIR: "starship"

    # XDG Data-based paths
    xdg_data_paths:
      base: "$XDG_DATA_HOME"
      paths:
        DOTFILES_DIR: "chezmoi"

    # XDG Home-based paths
    xdg_home_paths:
      base: "$HOME"
      paths:
        GIT_CLONE_DIRECTORY: "source"

  # Command execution variables (shell handles the execution syntax)
  command_variables:
    SDKROOT: "xcrun --sdk macosx --show-sdk-path"

  # Path variables that depend on command results
  derived_path_variables:
    CPATH:
      base: "$SDKROOT"
      path: "usr/include"
    LIBRARY_PATH:
      base: "$SDKROOT"
      path: "usr/lib"
