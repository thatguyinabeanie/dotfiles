# .chezmoidata/ai/tools.yaml
# Combined AI tools configuration including agents and MCP servers

# AI Agents and Assistants
agents:
  - name: "opencode-ai"
    install_via: npm
    runtime: node
    version: "latest"
    description: "OpenCode AI"
    category: code_assistant

  - name: "@augmentcode/auggie"
    install_via: bun
    runtime: native
    version: latest
    description: "Augment Code CLI"
    category: code_assistant

  - name: "@google/gemini-cli"
    install_via: bun
    runtime: native
    version: latest
    description: "Google Gemini Cli Coding Agent"
    category: code_assistant

  # - name: "@openai/codex"
  #   install_via: npm
  #   runtime: node
  #   version: latest
  #   description: "OpenAI Codex CLI"
  #   category: code_assistant

  - name: "@anthropic-ai/claude-code"
    install_via: bun
    runtime: native
    version: latest
    description: "Claude Code Commands Manager"
    category: chat_assistant

  # GUI AI Applications (macOS casks)
  - name: cursor
    install_via: brew_cask
    runtime: native
    description: "AI-powered code editor"
    category: ide
    macos_only: true

  # Terminal-based AI tools
  - name: charmbracelet/tap/mods
    install_via: brew
    runtime: native
    description: "AI on the command line"
    category: terminal

# Model Context Protocol (MCP) Servers
mcp_servers:
  # Core MCP servers (Node.js implementations) - verified to exist
  - name: "@modelcontextprotocol/server-filesystem"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP filesystem operations server"
    purpose: "File system operations and management"
    dependencies: []

  - name: "@modelcontextprotocol/server-memory"
    install_via: bun
    runtime: node
    version: latest
    description: "MCP memory management server"
    purpose: "Persistent memory and context management"
    dependencies: []

  # Development and deployment MCP servers
  - name: "vercel"
    install_via: bun
    runtime: node
    version: latest
    description: "Vercel CLI tool with MCP capabilities"
    purpose: "Vercel deployment and management"
    dependencies: []