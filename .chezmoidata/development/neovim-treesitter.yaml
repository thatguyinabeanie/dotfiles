# TreeSitter parsers for Neovim
neovim_treesitter:
  parsers:
    - bash
    - lua
    - javascript
    - typescript
    - tsx
    - html
    - css
    - scss
    - vue
    - svelte
    - json
    - yaml
    - toml
    - xml
    - csv
    - markdown
    - markdown_inline
    - vimdoc
    - dockerfile
    - nginx
    - ssh_config
    - git_config
    - gitignore
    - cmake
    - comment
    - diff
    - dot
    - embedded_template
    - elixir
    - gleam
    - gpg
    - graphql
    - java
    - jq
    - kotlin
    - llvm
    - luadoc
    - latex
    - nu
    - nix
    - norg
    - proto
    - query
    - readline
    - r
    - regex
    - rust
    - ruby
    - swift
    - superhtml
    - sql
    - scala
    - tmux
    - typst
    - terraform
    - vim
    - zig

  # Filetype configurations
  filetypes:
    # Template mappings
    templates:
      lua: lua.tmpl
      toml: toml.tmpl
      bash: [sh.tmpl, zsh.tmpl]
      nu: nu.tmpl

    # LSP server mappings
    lsp_servers:
      javascript: typescript-language-server
      typescript: typescript-language-server
      javascriptreact: typescript-language-server
      typescriptreact: typescript-language-server
      rust: rust-analyzer
      go: gopls
      css: css-lsp
      html: html-lsp
      dockerfile: dockerfile-language-server
      json: json-lsp
      jsonc: json-lsp

    # Framework-specific filetypes
    web_frameworks:
      - html
      - css
      - scss
      - javascript
      - javascriptreact
      - typescript
      - typescriptreact
      - vue
      - svelte

    typescript_stack:
      - javascript
      - javascriptreact
      - typescript
      - typescriptreact
      - vue