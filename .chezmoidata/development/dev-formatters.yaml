dev_formatters:
  # Code formatters and beautifiers
  universal_formatters:
    - prettierd
    - prettier

  language_specific:
    lua:
      - stylua
      - luaformatter
    
    yaml:
      - yamlfix
      - yamlfmt
    
    ruby:
      - standardrb
      - haml-lint
    
    python:
      - blackd-client
      - uv
    
    other:
      - kulala-fmt