dev_mise_architectures:
  # Mise architecture configurations for different installations
  architectures:
    native:
      binary: "mise"
      launchagent: "com.user.mise-update.plist"
    x64_variant:
      install_on_arm64: true
      arch: "x64"
      binary: "mise-x64"
      description: "x64"
      launchagent: "com.user.mise-x64-update.plist"
  
  # Update schedule configuration
  schedule:
    native:
      hour: 9
      minute: 0
    x64_variant:
      hour: 9
      minute: 15