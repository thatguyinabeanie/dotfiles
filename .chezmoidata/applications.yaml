# .chezmoidata/applications.yaml
# GUI applications, organized by context.

applications:
  work:
    # Work-specific — always installed when WORK_ENVIRONMENT=true
    - name: aws-vpn-client
      installer: [brew_cask]
    - name: lastpass
      installer: [brew_cask]

  shared:
    # ============================================================
    # DEFAULT — Core apps, always installed
    # ============================================================
    - name: aerospace
      installer: [brew_cask]
    - name: claude
      installer: [brew_cask]
    - name: claude-status-bar
      installer: [brew_cask]
    - name: cmux
      installer: [brew_cask]
    - name: cursor
      installer: [brew_cask]
    - name: espanso
      installer: [brew_cask]
    - name: ghostty
      installer: [brew_cask]
    - name: google-chrome
      installer: [brew_cask]
    - name: grandperspective
      installer: [brew_cask]
    - name: karabiner-elements
      installer: [brew_cask]
    - name: keka
      installer: [brew_cask]
    - name: nightfall
      installer: [brew_cask]
    - name: ngrok
      installer: [brew_cask]
    - name: opera
      installer: [brew_cask]
    - name: raycast
      installer: [brew_cask]
    - name: sf-symbols
      installer: [brew_cask]
    - name: visual-studio-code
      installer: [brew_cask]

    # ============================================================
    # EDITORS — Extra code editors and terminals
    # ============================================================
    - name: kitty
      installer: [brew_cask]
    - name: visual-studio-code@insiders
      installer: [brew_cask]
    - name: zed
      installer: [brew_cask]

    # ============================================================
    # PRODUCTIVITY — Daily productivity and communication
    # ============================================================
    - name: claude-devtools
      installer: [brew_cask]
    - name: cyberduck
      installer: [brew_cask]
    - name: firefox
      installer: [brew_cask]
    - name: obsidian
      installer: [brew_cask]
    - name: slack
      installer: [brew_cask]
    - name: spotify
      installer: [brew_cask]

    # ============================================================
    # PUBLISHING — LaTeX and document tools
    # ============================================================
    - name: mactex-no-gui  # 4+ GB
      installer: [brew_cask]

  personal:
    # ============================================================
    # DEFAULT — Core personal apps, always installed
    # ============================================================
    - name: 1password
      installer: [brew_cask]
    - name: 1password-cli
      installer: [brew_cask]
    - name: figma
      installer: [brew_cask]
    - name: whatsapp
      installer: [brew_cask]
    - name: temurin@8
      installer: [brew_cask]
      description: "Eclipse Temurin JDK 8"

    # ============================================================
    # CREATIVE — Music, design, video, photo
    # ============================================================
    - name: ableton-live-suite  # 70+ GB
      installer: [brew_cask]
    - name: affinity  # 2+ GB
      installer: [brew_cask]
    - name: blender  # 2+ GB
      installer: [brew_cask]
    - name: darktable
      installer: [brew_cask]
    - name: obs
      installer: [brew_cask]

    # ============================================================
    # 3D-PRINTING — Slicers, CAD, mesh tools
    # ============================================================
    - name: freecad  # ~500 MB
      installer: [brew_cask]
    - name: meshlab
      installer: [brew_cask]
    - name: openscad
      installer: [brew_cask]
    - name: orcaslicer
      installer: [brew_cask]

    # ============================================================
    # MOBILE-DEV — Mobile app development
    # ============================================================
    - name: android-studio  # 1+ GB
      installer: [brew_cask]
    - name: expo-orbit
      installer: [brew_cask]

    # ============================================================
    # SOCIAL — Chat and social apps
    # ============================================================
    - name: discord
      installer: [brew_cask]
    - name: betterdiscord-installer
      installer: [brew_cask]
