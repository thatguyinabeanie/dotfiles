formatters:
  # JavaScript/TypeScript ecosystem
  - name: prettier
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    install_via: mise
    conflicts_with_lsp_formatting: true
    mason_ensure_installed: true

  - name: "@fsouza/prettierd"
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    install_via: npm
    conflicts_with_lsp_formatting: true
    mason_ensure_installed: true
    mason_name: prettierd

  # Markdown
  - name: markdownlint-cli2
    languages: [markdown]
    install_via: mise
    mason_ensure_installed: true

  # Systems languages
  - name: rustfmt
    languages: [rust]
    install_via: rustup
    install_command: "rustup component add rustfmt"

  # Python
  - name: black
    languages: [python]
    install_via: pip
    mason_ensure_installed: true

  # blackd-client removed - blackd daemon included with black package

  # Ruby
  - name: standardrb
    languages: [ruby]
    install_via: gem
    mason_ensure_installed: true

  # Lua
  # luaformatter removed - doesn't exist on npm, stylua available via other methods

  # Shell
  - name: shfmt
    languages: [bash, sh, zsh]
    install_via: mise
    mason_ensure_installed: true

  # YAML
  - name: yamlfix
    languages: [yaml]
    install_via: brew
    mason_ensure_installed: true

  - name: yamlfmt
    languages: [yaml]
    install_via: brew
    mason_ensure_installed: true

  # Go (gofmt is built into Go toolchain - no separate installation needed)

  - name: goimports
    languages: [go]
    install_via: go
    install_command: "golang.org/x/tools/cmd/goimports@latest"
    mason_ensure_installed: true

  # HTTP/REST
  # kulala-fmt removed - available via Mason, not cargo

  # SQL
  - name: sql-formatter
    languages: [sql]
    install_via: npm
    mason_ensure_installed: true

  # XML/HTML
  - name: xmlformatter
    languages: [xml]
    install_via: pip
    mason_ensure_installed: true

  # CSS/SCSS
  - name: stylelint
    languages: [css, scss, sass]
    install_via: npm
    mason_ensure_installed: true

  # JSON
  - name: jq
    languages: [json]
    install_via: brew
    mason_ensure_installed: true

  # TOML
  - name: taplo
    languages: [toml]
    install_via: mise
    mason_ensure_installed: true

