formatters:
  # JavaScript/TypeScript ecosystem
  - name: prettier
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    install_via: npm
    runtime: node
    version: latest
    description: "Code formatter for web languages"
    conflicts_with_lsp_formatting: true
    mason_ensure_installed: true

  - name: "@fsouza/prettierd"
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    install_via: npm
    runtime: node
    version: latest
    description: "Fast Prettier daemon"
    conflicts_with_lsp_formatting: true
    mason_ensure_installed: true
    mason_name: prettierd

  # Systems languages
  - name: rustfmt
    languages: [rust]
    install_via: rustup
    runtime: rust
    version: latest
    description: "Rust code formatter"
    builtin_to_toolchain: true
    install_command: "rustup component add rustfmt"

  # Python
  - name: black
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Python code formatter"
    mason_ensure_installed: true

  # blackd-client removed - blackd daemon included with black package

  # Ruby
  - name: standardrb
    languages: [ruby]
    install_via: gem
    runtime: ruby
    version: latest
    description: "Ruby formatter and linter"
    mason_ensure_installed: true

  # Lua
  # luaformatter removed - doesn't exist on npm, stylua available via other methods

  # Shell
  - name: shfmt
    languages: [bash, sh, zsh]
    install_via: mise
    runtime: native
    version: latest
    description: "Shell script formatter"
    mason_ensure_installed: true

  # YAML
  - name: yamlfix
    languages: [yaml]
    install_via: brew
    runtime: native
    version: latest
    description: "YAML formatter and fixer"

  - name: yamlfmt
    languages: [yaml]
    install_via: brew
    runtime: native
    version: latest
    description: "YAML formatter"
    mason_ensure_installed: true

  # Go (gofmt is built into Go toolchain - no separate installation needed)

  - name: goimports
    languages: [go]
    install_via: go
    runtime: go
    version: latest
    description: "Go imports formatter"
    install_command: "golang.org/x/tools/cmd/goimports@latest"
    mason_ensure_installed: true

  # HTTP/REST
  # kulala-fmt removed - available via Mason, not cargo

  # SQL
  - name: sql-formatter
    languages: [sql]
    install_via: npm
    runtime: node
    version: latest
    description: "SQL formatter"
    mason_ensure_installed: true

  # XML/HTML
  - name: xmlformatter
    languages: [xml]
    install_via: pip
    runtime: python
    version: latest
    description: "XML formatter"
    mason_ensure_installed: true

  # CSS/SCSS
  - name: stylelint
    languages: [css, scss, sass]
    install_via: npm
    runtime: node
    version: latest
    description: "CSS/SCSS formatter and linter"
    mason_ensure_installed: true

  # JSON
  - name: jq
    languages: [json]
    install_via: brew
    runtime: native
    version: latest
    description: "JSON processor and formatter"
    mason_ensure_installed: true

  # TOML
  - name: taplo
    languages: [toml]
    install_via: mise
    runtime: native
    version: latest
    description: "TOML formatter"
    mason_ensure_installed: true

  # Dockerfile
  # dockerfile-formatter removed - doesn't exist on npm
