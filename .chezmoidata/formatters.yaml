formatters:
  # JavaScript/TypeScript ecosystem
  - name: prettier
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    install_via: npm
    runtime: node
    version: latest
    description: "Code formatter for web languages"
    conflicts_with_lsp_formatting: true

  - name: prettierd
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    install_via: npm
    runtime: node
    version: latest
    description: "Fast Prettier daemon"
    conflicts_with_lsp_formatting: true

  # Systems languages
  - name: rustfmt
    languages: [rust]
    install_via: rustup
    runtime: rust
    version: latest
    description: "Rust code formatter"
    builtin_to_toolchain: true
    install_command: "rustup component add rustfmt"

  # Python
  - name: black
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Python code formatter"

  - name: blackd-client
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Black formatter daemon client"

  # Ruby
  - name: standardrb
    languages: [ruby]
    install_via: gem
    runtime: ruby
    version: latest
    description: "Ruby formatter and linter"

  # Lua
  - name: luaformatter
    languages: [lua]
    install_via: npm
    runtime: node
    version: latest
    description: "Lua code formatter"

  # Shell
  - name: shfmt
    languages: [bash, sh, zsh]
    install_via: mise
    runtime: native
    version: latest
    description: "Shell script formatter"

  # YAML
  - name: yamlfix
    languages: [yaml]
    install_via: brew
    runtime: native
    version: latest
    description: "YAML formatter and fixer"

  - name: yamlfmt
    languages: [yaml]
    install_via: brew
    runtime: native
    version: latest
    description: "YAML formatter"

  # Go (built into language server)
  - name: gofmt
    languages: [go]
    install_via: go
    runtime: go
    version: latest
    description: "Go code formatter"
    builtin_to_toolchain: true
    install_command: "golang.org/x/tools/cmd/gofmt@latest"

  - name: goimports
    languages: [go]
    install_via: go
    runtime: go
    version: latest
    description: "Go imports formatter"
    install_command: "golang.org/x/tools/cmd/goimports@latest"

  # HTTP/REST
  - name: kulala-fmt
    languages: [http]
    install_via: cargo
    runtime: rust
    version: latest
    description: "HTTP request formatter"

  # SQL
  - name: sql-formatter
    languages: [sql]
    install_via: npm
    runtime: node
    version: latest
    description: "SQL formatter"

  # XML/HTML
  - name: xmlformat
    languages: [xml]
    install_via: pip
    runtime: python
    version: latest
    description: "XML formatter"

  # CSS/SCSS
  - name: stylelint
    languages: [css, scss, sass]
    install_via: npm
    runtime: node
    version: latest
    description: "CSS/SCSS formatter and linter"

  # JSON
  - name: jq
    languages: [json]
    install_via: brew
    runtime: native
    version: latest
    description: "JSON processor and formatter"

  # TOML
  - name: taplo
    languages: [toml]
    install_via: mise
    runtime: native
    version: latest
    description: "TOML formatter"

  # Dockerfile
  - name: dockerfile-formatter
    languages: [dockerfile]
    install_via: npm
    runtime: node
    version: latest
    description: "Dockerfile formatter"
