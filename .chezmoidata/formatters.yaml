formatters:
  # JavaScript/TypeScript ecosystem
  - name: prettier
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    installer: [mise, mason]
    conflicts_with_lsp_formatting: true

  - name: "@fsouza/prettierd"
    languages: [typescript, javascript, json, yaml, html, css, markdown, scss, vue, svelte]
    installer: [npm, mason]
    conflicts_with_lsp_formatting: true
    mason_name: prettierd

  # Markdown
  - name: markdownlint-cli2
    languages: [markdown]
    installer: [mise, mason]

  # Systems languages
  - name: rustfmt
    languages: [rust]
    installer: [rustup]
    install_command: "rustup component add rustfmt"

  # Python
  - name: black
    languages: [python]
    installer: [mason]

  # blackd-client removed - blackd daemon included with black package

  # Ruby
  - name: standardrb
    languages: [ruby]
    installer: [gem, mason]

  # Shell
  - name: shfmt
    languages: [bash, sh, zsh]
    installer: [mise, mason]

  # YAML
  - name: yamlfix
    languages: [yaml]
    installer: [brew, mason]

  - name: yamlfmt
    languages: [yaml]
    installer: [brew, mason]

  # Go (gofmt is built into Go toolchain - no separate installation needed)

  - name: goimports
    languages: [go]
    installer: [go, mason]
    install_command: "golang.org/x/tools/cmd/goimports@latest"

  # HTTP/REST
  # kulala-fmt removed - available via Mason, not cargo

  # SQL
  - name: sql-formatter
    languages: [sql]
    installer: [npm, mason]

  # XML/HTML
  - name: xmlformatter
    languages: [xml]
    installer: [mason]

  # CSS/SCSS
  - name: stylelint
    languages: [css, scss, sass]
    installer: [npm, mason]

  # JSON
  - name: jq
    languages: [json]
    installer: [brew, mason]

  # TOML
  - name: taplo
    languages: [toml]
    installer: [mise, mason]

