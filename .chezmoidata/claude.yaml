# Claude Code Permission Rules (personal, all projects)
#
# Source of truth for `permissions.allow`, `permissions.deny`, `permissions.ask`, `hooks`,
# and `autoMode` in ~/.claude/settings.json. Rendered by dot_claude/modify_settings.json,
# a chezmoi `modify_` script. The permissions lists merge into the existing permissions
# object; `hooks` and `autoMode` (under `claude_settings` below) are replaced wholesale.
# Every other key (theme, model, enabledPlugins, mcpServers, and the permissions siblings
# defaultMode / disableAutoMode) passes through untouched.
#
# THREE TIERS -- know which one a rule belongs in:
#   1. Org (wins over everything): claude-code-marketplace/managed-settings/managed-settings.json
#      -> deployed to /Library/Application Support/ClaudeCode/managed-settings.json.
#      Already allows `Read`, `Edit`, `Bash(* --version)`, `Bash(* --help*)` and sets
#      disableAutoMode/disableBypassPermissionsMode. Adding a rule HERE cannot override it.
#   2. This file: generalizes across all of Gabe's projects but is personal to his
#      toolchain (chezmoi, mise, his doc domains).
#   3. Per-repo `.claude/settings.json` (checked in, team-shared) or
#      `.claude/settings.local.json` (personal, gitignored): stack-coupled rules such as
#      `npx prisma generate`, `npm run lint`, `docker-compose *`.
#
# DRIFT: Claude Code appends newly-approved rules straight into the live file, and the
# next `chezmoi apply` drops anything absent here. Check with
# `diff <(jq -S . ~/.claude/settings.json) <(chezmoi cat ~/.claude/settings.json | jq -S .)`
# (`<` lines are lost on apply), then promote what is worth keeping BY HAND --
# auto-recorded rules are mostly single-use exact matches, which is how this list once
# reached 424 entries.
#
# INCLUSION STANDARD: prefix rules do NO flag-level analysis, so `Bash(foo *)` must be
# safe for ANY arguments. Do not add:
#   - runners that pass arguments through: npx, npm run/install/ci, mise run/install/trust,
#     pre-commit, lefthook run, docker run/exec, python -m pytest
#   - git fetch/pull/ls-remote (--upload-pack=<cmd>) and git config (core.pager=<cmd>)
#   - gh api * (a prefix rule cannot express GET-only)
#   - program-position wildcards: `* --version` (the * IS the program)
#   - interpreters and shell-outs: python3 *, node -e, zsh -c, fish -c, ruby, xargs,
#     sed (-i writes), awk (system()), osascript, psql, bash <script>
#   - secret printers: env, mise env, mise hook-env
#   - flag-driven execution: zsh -n (+n re-enables exec), chezmoi <cmd> * (--config,
#     --pager, --source), git grep (-O<cmd>), go vet (-vettool), diffstat (-o writes)
#   - unrestricted destruction: rm:*, chmod:*, killall:*, pip install:*
#   - mcp__*__browser_evaluate and similar (executes arbitrary JavaScript)
#
# Bare read-only commands (ls, cat, grep, find, git status/log/diff) are allowed by org
# policy already and need no entry here.

claude_permissions:
  deny:
    - "Bash(dd *)"
    - "Read(./.env.*)"
    - "Read(./.env)"
    - "Read(./**/.env*)"
    - "Read(./secrets/**)"
    - "Read(~/.aws/credentials)"
    - "Read(~/.kube/config)"
    - "Read(~/.ssh/**)"

  ask:
    - "Bash(rm -rf *)"
    - "Bash(find *-delete*)"
    - "Bash(find *-exec*)"
    - "Bash(rg *--pre*)"

