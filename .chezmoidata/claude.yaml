# Replaced wholesale on apply (not merged), so removing an entry here removes it from the
# live file. Hook entries keep the matcher each one had in the live file.
claude_settings:
  hooks:
    SessionStart:
      - matcher: ".*"
        hooks:
          - type: command
            command: &claudebar_hook |-
              __claudebar_hook() { [ "$CLAUDEBAR_PROBE" = "1" ] && return 0; PORT=$(cat "$HOME/.claude/claudebar-hook-port" 2>/dev/null || echo 19847); cat | curl -s -X POST "http://localhost:${PORT}/hook" -H 'Content-Type: application/json' -d @- > /dev/null 2>&1 & }; __claudebar_hook
    SessionEnd:
      - matcher: ".*"
        hooks:
          - type: command
            command: *claudebar_hook
    Stop:
      - matcher: ".*"
        hooks:
          - type: command
            command: *claudebar_hook
    SubagentStart:
      - matcher: ".*"
        hooks:
          - type: command
            command: *claudebar_hook
    SubagentStop:
      - matcher: ".*"
        hooks:
          - type: command
            command: *claudebar_hook
    TaskCompleted:
      - matcher: ".*"
        hooks:
          - type: command
            command: *claudebar_hook
    UserPromptSubmit:
      - hooks:
          - type: command
            command: |-
              bash ~/.claude/hooks/style-reminder.sh
      - matcher: ".*"
        hooks:
          - type: command
            command: *claudebar_hook

  autoMode:
    environment:
      - "### Org-wide"
      - "**Organization**: Civis Analytics "
      - "**Cloud provider(s)**: AWS (civis-secure account via Okta, ECR registry)"
      - "**Repository visibility**: civisanalytics GitHub org, private"
      - "**Internal sharing / snippet hosting**: None configured; treat public paste/gist services as outside the trust boundary"
      - "**Secrets management**: None configured"
      - "**Default / protected branches**: main, assume protected"
      - "**CI/CD deploy targets**: None configured"
      - "**Network posture**: None configured"
      - "**Host containment**: None configured; assume Claude Code runs on an ordinary developer machine or CI runner with open internet"
      - "**Source control**: civisanalytics GitHub org, private"
      - "**Trusted internal domains**: civisanalytics.atlassian.net (Confluence); registry.nes.herodevs.com (package registry host)"
      - "**Trusted cloud buckets**: None configured"
      - "**Key internal services**: ECR registries in the civis-secure AWS account; `*.civis.test` local dev endpoints"
      - "**Internal package registry**: GitHub Packages (private packages); registry.nes.herodevs.com"
      - "**Sensitive data locations & audiences**: credential, secret, and Kubernetes deployment code in any repo (files named `*credential*` or `*secret*`, `lib/kubernetes/`): share only with audiences cleared for credential/secrets handling"
      - "**Data retention / declassification**: None configured"
      - "**Sensitive remote targets**: any namespace, host, or container whose name carries prod or production as a whole word or name segment"
      - "**Protected deployment namespaces / environments**: None configured; fall back to the Sensitive remote targets heuristic"
      - "**Protected IaC scopes**: IAM, RBAC, networking, quota, and node-pool resources; anything whose name or tag carries prod or production as a whole word or name segment"
      - "### User-specific"
      - "**Primary use of Claude Code**: software development"
      - "**Trusted repo**: any git repo under `~/source/` with a civisanalytics remote, including worktrees in `.claude/worktrees/` or `.worktrees/`"
      - "**Org-specific CLIs**: civis-secure (AWS/Okta credential helper); chezmoi (dotfile manager, not org-specific but routine); mise; acli; herdr; ccr"
      - "**Routine under user prefix**: git workflow aliases (gs, gd, gpl, gco, gp, gwts, gwtrm, gcob) are routine"
