linters:
  # ============================================================
  # DEFAULT PROFILE — Core linters for everyday work
  # ============================================================

  # Shell
  - name: shellcheck
    languages: [bash, sh, zsh]
    installer: [brew, mason]

  # Lua (needed for neovim config)
  - name: luacheck
    languages: [lua]
    installer: [brew, mason]

  # Web development
  - name: eslint_d
    languages: [typescript, javascript, javascriptreact, typescriptreact]
    installer: [npm, mason]

  # Markdown and documentation
  - name: vale
    languages: [markdown, text]
    installer: [brew, mason]

  - name: marksman
    languages: [markdown]
    installer: [brew, mason]

  - name: markdown-link-check
    languages: [markdown]
    installer: [npm]

  # Go
  - name: golangci-lint
    languages: [go]
    installer: [mise, mason]

  - name: golangci-lint-langserver
    languages: [go]
    installer: [mise, mason]

  # Python
  - name: ruff
    languages: [python]
    installer: [mise, mason]

  # YAML
  - name: yamllint
    languages: [yaml]
    installer: [mise, mason]

  # Rust (bundled with toolchain)
  - name: clippy
    languages: [rust]
    installer: [rustup]
    install_command: "rustup component add clippy"

  # Security
  - name: gitleaks
    languages: [git]
    installer: [mise, mason]

  # Spelling
  - name: typos
    languages: [text, markdown]
    installer: [mise, mason]

  - name: cspell
    languages: [text, markdown, code]
    installer: [brew, mason]

  # JSON
  - name: jsonlint
    languages: [json]
    installer: [npm, mason]

  # Containers
  - name: hadolint
    languages: [dockerfile]
    installer: [brew, mason]

  # Environment files
  - name: dotenv-linter
    languages: [env]
    installer: [mise, mason]

  # ============================================================
  # INFRA PROFILE — Infrastructure-specific linters
  # ============================================================
  - name: kube-linter
    languages: [yaml]
    installer: [mise, mason]
    profiles: [infra]

  - name: tflint
    languages: [terraform]
    installer: [mise, mason]
    profiles: [infra]

  # ============================================================
  # LANGUAGES PROFILE — Additional language linters
  # ============================================================

  # Python (extras beyond ruff)
  - name: flake8
    languages: [python]
    installer: [mason]
    profiles: [languages]

  - name: pylint
    languages: [python]
    installer: [mason]
    profiles: [languages]

  - name: mypy
    languages: [python]
    installer: [mason]
    profiles: [languages]

  # Ruby
  - name: rubocop
    languages: [ruby]
    installer: [gem]
    profiles: [languages]

  - name: haml-lint
    languages: [haml]
    installer: [mason]
    profiles: [languages]

  # ============================================================
  # EXTRAS PROFILE — Specialty linters
  # ============================================================
  - name: semgrep
    languages: [python, javascript, typescript, go, java, ruby]
    installer: [mise, mason]
    profiles: [extras]

  - name: bandit
    languages: [python]
    installer: [mason]
    profiles: [extras]

  - name: sqlfluff
    languages: [sql]
    installer: [mason]
    profiles: [databases]

  - name: buf
    languages: [proto]
    installer: [mise, mason]
    profiles: [extras]
