linters:
  # Shell linters
  - name: shellcheck
    languages: [bash, sh, zsh]
    installer: [brew, mason]

  - name: luacheck
    languages: [lua]
    installer: [brew, mason]

  # Web development linters
  - name: eslint_d
    languages: [typescript, javascript, javascriptreact, typescriptreact]
    installer: [npm, mason]

  # vscode-eslint-language-server removed - doesn't exist on npm, eslint_d covers this

  - name: stylelint
    languages: [css, scss, sass]
    installer: [npm, mason]

  # Markup and documentation linters
  - name: vale
    languages: [markdown, text]
    installer: [brew, mason]

  - name: marksman
    languages: [markdown]
    installer: [brew, mason]

  - name: markdown-oxide
    languages: [markdown]
    installer: [cargo, mason]
    install_command: "cargo install --locked --git https://github.com/Feel-ix-343/markdown-oxide.git markdown-oxide"

  - name: markdown-link-check
    languages: [markdown]
    installer: [npm]

  # Container and infrastructure linters
  - name: hadolint
    languages: [dockerfile]
    installer: [brew, mason]

  - name: kube-linter
    languages: [yaml]
    installer: [mise, mason]

  - name: tflint
    languages: [terraform]
    installer: [brew, mason]

  # YAML linters
  - name: yamllint
    languages: [yaml]
    installer: [mise, mason]

  # Go linters
  - name: golangci-lint
    languages: [go]
    installer: [mise, mason]

  - name: golangci-lint-langserver
    languages: [go]
    installer: [mise, mason]

  # Python linters
  - name: ruff
    languages: [python]
    installer: [mise, mason]

  - name: flake8
    languages: [python]
    installer: [mason]

  - name: pylint
    languages: [python]
    installer: [mason]

  - name: mypy
    languages: [python]
    installer: [mason]

  # Ruby linters
  - name: rubocop
    languages: [ruby]
    installer: [mason]

  - name: standardrb
    languages: [ruby]
    installer: [mason]

  - name: haml-lint
    languages: [haml]
    installer: [mason]

  # Environment and configuration linters
  - name: dotenv-linter
    languages: [env]
    installer: [mise, mason]

  # Security linters
  - name: gitleaks
    languages: [git]
    installer: [mise, mason]

  - name: semgrep
    languages: [python, javascript, typescript, go, java, ruby]
    installer: [mise, mason]

  - name: bandit
    languages: [python]
    installer: [mason]

  # Spelling and typo linters
  - name: typos
    languages: [text, markdown]
    installer: [mise, mason]

  - name: typos-lsp
    languages: [text, markdown]
    installer: [cargo, mason]
    install_command: "cargo install --git https://github.com/tekumara/typos-lsp typos-lsp"

  - name: cspell
    languages: [text, markdown, code]
    installer: [brew, mason]

  # JSON linters
  - name: jsonlint
    languages: [json]
    installer: [npm, mason]

  # SQL linters
  - name: sqlfluff
    languages: [sql]
    installer: [mason]

  # Rust linters (built into toolchain)
  - name: clippy
    languages: [rust]
    installer: [rustup]
    install_command: "rustup component add clippy"
    # Note: clippy is not available in Mason registry, managed via rustup

  # Protocol buffer linters
  - name: buf
    languages: [proto]
    installer: [mise, mason]

  # Nginx configuration linter
  # nginx-linter removed - doesn't exist on npm
