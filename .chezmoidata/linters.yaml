linters:
  # Shell linters
  - name: shellcheck
    languages: [bash, sh, zsh]
    install_via: brew
    runtime: native
    version: latest
    description: "Shell script linter"
    mason_ensure_installed: true

  - name: luacheck
    languages: [lua]
    install_via: brew
    runtime: native
    version: latest
    description: "Lua linter"
    mason_ensure_installed: true

  # Web development linters
  - name: eslint_d
    languages: [typescript, javascript, javascriptreact, typescriptreact]
    install_via: bun
    runtime: node
    version: latest
    description: "Fast ESLint daemon"
    mason_ensure_installed: true

  # vscode-eslint-language-server removed - doesn't exist on npm, eslint_d covers this

  - name: stylelint
    languages: [css, scss, sass]
    install_via: bun
    runtime: node
    version: latest
    description: "CSS/SCSS linter"
    mason_ensure_installed: true

  # Markup and documentation linters
  - name: vale
    languages: [markdown, text]
    install_via: brew
    runtime: native
    version: latest
    description: "Prose linter"
    mason_ensure_installed: true

  - name: marksman
    languages: [markdown]
    install_via: brew
    runtime: native
    version: latest
    description: "Markdown linter and language server"
    mason_ensure_installed: true

  - name: markdown-oxide
    languages: [markdown]
    install_via: cargo
    runtime: rust
    version: latest
    description: "Alternative Markdown linter"
    install_command: "cargo install --locked --git https://github.com/Feel-ix-343/markdown-oxide.git markdown-oxide"
    mason_ensure_installed: true

  # Container and infrastructure linters
  - name: hadolint
    languages: [dockerfile]
    install_via: brew
    runtime: native
    version: latest
    description: "Dockerfile linter"
    mason_ensure_installed: true

  - name: kube-linter
    languages: [yaml]
    install_via: mise
    runtime: native
    version: latest
    description: "Kubernetes YAML linter"
    mason_ensure_installed: true

  - name: tflint
    languages: [terraform]
    install_via: brew
    runtime: native
    version: latest
    description: "Terraform linter"
    mason_ensure_installed: true

  # YAML linters
  - name: yamllint
    languages: [yaml]
    install_via: brew
    runtime: native
    version: latest
    description: "YAML linter"
    mason_ensure_installed: true

  # Go linters
  - name: golangci-lint
    languages: [go]
    install_via: mise
    runtime: go
    version: latest
    description: "Go meta-linter"
    mason_ensure_installed: true

  - name: golangci-lint-langserver
    languages: [go]
    install_via: mise
    runtime: go
    version: latest
    description: "Go linter language server"
    mason_ensure_installed: true

  # Python linters
  - name: ruff
    languages: [python]
    install_via: mise
    runtime: python
    version: latest
    description: "Fast Python linter"
    mason_ensure_installed: true

  - name: flake8
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Python linter"
    mason_ensure_installed: true

  - name: pylint
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Python static analysis"
    mason_ensure_installed: true

  - name: mypy
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Python type checker"
    mason_ensure_installed: true

  # Ruby linters
  - name: rubocop
    languages: [ruby]
    install_via: gem
    runtime: ruby
    version: latest
    description: "Ruby linter and formatter"
    mason_ensure_installed: true

  - name: standardrb
    languages: [ruby]
    install_via: gem
    runtime: ruby
    version: latest
    description: "Ruby standard style linter"
    mason_ensure_installed: true

  - name: haml-lint
    languages: [haml]
    install_via: gem
    runtime: ruby
    version: latest
    description: "HAML linter"
    mason_ensure_installed: true

  # Environment and configuration linters
  - name: dotenv-linter
    languages: [env]
    install_via: mise
    runtime: native
    version: latest
    description: ".env file linter"
    mason_ensure_installed: true

  # Security linters
  - name: gitleaks
    languages: [git]
    install_via: mise
    runtime: go
    version: latest
    description: "Git secrets scanner"
    mason_ensure_installed: true

  - name: semgrep
    languages: [python, javascript, typescript, go, java, ruby]
    install_via: mise
    runtime: python
    version: latest
    description: "Static analysis for security"
    mason_ensure_installed: true

  - name: bandit
    languages: [python]
    install_via: pip
    runtime: python
    version: latest
    description: "Python security linter"
    mason_ensure_installed: true

  # Spelling and typo linters
  - name: typos
    languages: [text, markdown]
    install_via: mise
    runtime: native
    version: latest
    description: "Typo checker"
    mason_ensure_installed: true

  - name: typos-lsp
    languages: [text, markdown]
    install_via: cargo
    runtime: rust
    version: latest
    description: "Typo checker language server"
    install_command: "cargo install --git https://github.com/tekumara/typos-lsp typos-lsp"
    mason_ensure_installed: true

  - name: cspell
    languages: [text, markdown, code]
    install_via: brew
    runtime: native
    version: latest
    description: "Code spell checker"
    mason_ensure_installed: true

  # JSON linters
  - name: jsonlint
    languages: [json]
    install_via: bun
    runtime: node
    version: latest
    description: "JSON linter"
    mason_ensure_installed: true

  # SQL linters
  - name: sqlfluff
    languages: [sql]
    install_via: pip
    runtime: python
    version: latest
    description: "SQL linter and formatter"
    mason_ensure_installed: true

  # Rust linters (built into toolchain)
  - name: clippy
    languages: [rust]
    install_via: rustup
    runtime: rust
    version: latest
    description: "Rust linter"
    builtin_to_toolchain: true
    install_command: "rustup component add clippy"
    # Note: clippy is not available in Mason registry, managed via rustup

  # XML linters (xmllint is part of libxml2, installed by default on macOS)
  # - name: xmllint
  #   languages: [xml]
  #   install_via: system
  #   runtime: native
  #   version: latest
  #   description: "XML linter (system provided)"

  # Protocol buffer linters
  - name: buf
    languages: [proto]
    install_via: mise
    runtime: native
    version: latest
    description: "Protocol buffer linter"
    mason_ensure_installed: true

  # Nginx configuration linter
  # nginx-linter removed - doesn't exist on npm
