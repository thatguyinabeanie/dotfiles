linters:
  # Shell linters
  - name: shellcheck
    languages: [bash, sh, zsh]
    install_via: brew
    mason_ensure_installed: true

  - name: luacheck
    languages: [lua]
    install_via: brew
    mason_ensure_installed: true

  # Web development linters
  - name: eslint_d
    languages: [typescript, javascript, javascriptreact, typescriptreact]
    install_via: bun
    mason_ensure_installed: true

  # vscode-eslint-language-server removed - doesn't exist on npm, eslint_d covers this

  - name: stylelint
    languages: [css, scss, sass]
    install_via: bun
    mason_ensure_installed: true

  # Markup and documentation linters
  - name: vale
    languages: [markdown, text]
    install_via: brew
    mason_ensure_installed: true

  - name: marksman
    languages: [markdown]
    install_via: brew
    mason_ensure_installed: true

  - name: markdown-oxide
    languages: [markdown]
    install_via: cargo
    install_command: "cargo install --locked --git https://github.com/Feel-ix-343/markdown-oxide.git markdown-oxide"
    mason_ensure_installed: true

  - name: markdown-link-check
    languages: [markdown]
    install_via: npm
    mason_ensure_installed: false

  # Container and infrastructure linters
  - name: hadolint
    languages: [dockerfile]
    install_via: brew
    mason_ensure_installed: true

  - name: kube-linter
    languages: [yaml]
    install_via: mise
    mason_ensure_installed: true

  - name: tflint
    languages: [terraform]
    install_via: brew
    mason_ensure_installed: true

  # YAML linters
  - name: yamllint
    languages: [yaml]
    install_via: brew
    mason_ensure_installed: true

  # Go linters
  - name: golangci-lint
    languages: [go]
    install_via: mise
    mason_ensure_installed: true

  - name: golangci-lint-langserver
    languages: [go]
    install_via: mise
    mason_ensure_installed: true

  # Python linters
  - name: ruff
    languages: [python]
    install_via: mise
    mason_ensure_installed: true

  - name: flake8
    languages: [python]
    install_via: pip
    mason_ensure_installed: true

  - name: pylint
    languages: [python]
    install_via: pip
    mason_ensure_installed: true

  - name: mypy
    languages: [python]
    install_via: pip
    mason_ensure_installed: true

  # Ruby linters
  - name: rubocop
    languages: [ruby]
    install_via: gem
    mason_ensure_installed: true

  - name: standardrb
    languages: [ruby]
    install_via: gem
    mason_ensure_installed: true

  - name: haml-lint
    languages: [haml]
    install_via: gem
    mason_ensure_installed: true

  # Environment and configuration linters
  - name: dotenv-linter
    languages: [env]
    install_via: mise
    mason_ensure_installed: true

  # Security linters
  - name: gitleaks
    languages: [git]
    install_via: mise
    mason_ensure_installed: true

  - name: semgrep
    languages: [python, javascript, typescript, go, java, ruby]
    install_via: mise
    mason_ensure_installed: true

  - name: bandit
    languages: [python]
    install_via: pip
    mason_ensure_installed: true

  # Spelling and typo linters
  - name: typos
    languages: [text, markdown]
    install_via: mise
    mason_ensure_installed: true

  - name: typos-lsp
    languages: [text, markdown]
    install_via: cargo
    install_command: "cargo install --git https://github.com/tekumara/typos-lsp typos-lsp"
    mason_ensure_installed: true

  - name: cspell
    languages: [text, markdown, code]
    install_via: brew
    mason_ensure_installed: true

  # JSON linters
  - name: jsonlint
    languages: [json]
    install_via: bun
    mason_ensure_installed: true

  # SQL linters
  - name: sqlfluff
    languages: [sql]
    install_via: pip
    mason_ensure_installed: true

  # Rust linters (built into toolchain)
  - name: clippy
    languages: [rust]
    install_via: rustup
    install_command: "rustup component add clippy"
    # Note: clippy is not available in Mason registry, managed via rustup

  # XML linters (xmllint is part of libxml2, installed by default on macOS)
  # - name: xmllint
  #   languages: [xml]
  #   install_via: system
  #   runtime: native
  #   version: latest
  #   description: "XML linter (system provided)"

  # Protocol buffer linters
  - name: buf
    languages: [proto]
    install_via: mise
    mason_ensure_installed: true

  # Nginx configuration linter
  # nginx-linter removed - doesn't exist on npm
