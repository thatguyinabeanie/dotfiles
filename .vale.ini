# Vale configuration for dotfiles repository
StylesPath = .vale/styles

MinAlertLevel = error

# Package references for style downloading
Packages = Google, write-good

[*.{md,txt}]
BasedOnStyles = Google, write-good

# Disable overly pedantic rules for technical documentation
Google.Headings = NO
Google.Parens = NO
write-good.TooWordy = NO
write-good.E-Prime = NO

[*.{html}]
BasedOnStyles = Google, write-good