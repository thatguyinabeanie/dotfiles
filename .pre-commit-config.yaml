---
# 🛡️ Pre-commit Configuration for Dotfiles
#
# This configuration enforces code quality standards and catches issues
# before they're committed to the repository.
#
# Pokemon: Scizor (#212) - Known for its precision and attention to detail,
# just like these pre-commit hooks that catch small issues before they become problems.

repos:
  # Pokémon pixel art pre-commit hook (runs first)
  - repo: local
    hooks:
      - id: pokemon-art
        name: Pokémon Pixel Art
        entry: MISSION_CONTROL/.chezmoiscripts/precommit/pre-commit-pokemon.sh
        language: system
        always_run: true

  # Core hooks for basic code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: 🧹 Remove trailing whitespace
      - id: end-of-file-fixer
        name: 📄 Fix end of files
      - id: check-yaml
        name: 🔍 Check YAML syntax
      - id: check-added-large-files
        name: 📏 Check for large files
      - id: check-merge-conflict
        name: 🔀 Check for merge conflicts
      - id: check-executables-have-shebangs
        name: 🔧 Check executable shebang
      - id: check-shebang-scripts-are-executable
        name: 🔧 Check scripts are executable
      - id: detect-private-key
        name: 🔒 Detect private keys
      - id: mixed-line-ending
        name: 📝 Fix line endings
        args: [--fix=lf]

  # Go linting - Alakazam (#65) - Known for its intelligence, perfect for Go code analysis
  - repo: local
    hooks:
      - id: golangci-lint
        name: 🧠 Go code linting
        entry: bash -c 'command -v golangci-lint >/dev/null && golangci-lint run --timeout=5m'
        language: system
        types: [go]
        pass_filenames: false

  # Shell script linting - Krabby (#98) - Hard shell but precise pincers, like shell script validation
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: 🦀 Shell script linting
        args: [--severity=warning]
        exclude: \.tmpl$
        types: [shell, bash]
        files: \.(sh|bash)$

  # Markdown linting - Meowth (#52) - Articulate and precise, like well-formatted markdown
  # TODO: Improve pre-commit-markdownlint.sh to handle automatic fixing of common issues:
  # - Add language tags to code blocks (MD040)
  # - Add blank lines around lists (MD032)
  # - Break long lines or configure to ignore them (MD013)
  - repo: local
    hooks:
      - id: markdownlint
        name: 📝 Markdown linting
        entry: MISSION_CONTROL/.chezmoiscripts/precommit/pre-commit-markdownlint.sh
        args: [--config, .markdownlint.yaml, --fix]
        language: system
        types: [markdown]
        exclude: MISSION_CONTROL/dot_config/git/hooks/README.md

  # YAML linting - Porygon (#137) - Digital Pokemon that ensures data structures are correct
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        name: 🔍 YAML linting
        args: [--config-file, .yamllint.yml]

  # Gitleaks for secret scanning - Sableye (#302) - Gem-eyed Pokemon that finds hidden treasures
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        name: 💎 Secret scanning
        args: [--config, MISSION_CONTROL/dot_config/gitleaks/config.toml]

  # Go tests - Slowking (#199) - Wise and thoughtful, perfect for testing
  - repo: local
    hooks:
      - id: go-test
        name: 🧪 Go tests
        entry: bash -c 'cd MISSION_CONTROL/.tests && go test -v ./...'
        language: system
        pass_filenames: false
        types: [go]
        always_run: false
