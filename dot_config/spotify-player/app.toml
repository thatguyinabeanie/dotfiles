# Spotify Player configuration
# Documentation: https://github.com/aome510/spotify-player/blob/master/docs/config.md

# Theme and appearance
theme = "default"
cover_img_length = 9
cover_img_width = 5

# Playback settings
enable_media_control = true
enable_notify = false
enable_streaming = true

# Audio settings
device = "spotify-player"
audio_quality = "High"

# Interface settings
mouse_support = true
border_type = "Plain"

# Default device on startup
default_device = "spotify-player"

# Keybindings - extend defaults
[keymaps]
# Add custom keybindings here if needed