##
## TMUX CONFIGURATION 
## 
## symlinked to: ~/.tmux.conf
##

##
## MAKES CONFIGURATION PORTABLE BETWEEN MACHINES OF DIFFERENT OS
##
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin:$PATH"
set -g default-command "$SHELL"

## 
## NON-NEGOTIABLE CONFIGURATIONS
##
set -g history-limit "100000"  # Keep 100k lines of scrollback history
set -g escape-time "0"         # No delay for escape key press
set -g set-clipboard "on"      # Enable clipboard integration
set -g mouse "on"              # Enable mouse support
set -g focus-events "on"       # Enable focus events for better mouse/focus tracking

## ENABLE PASSTHROUGH FOR IMAGE SUPPORT (image.nvim, etc.)
set -g allow-passthrough "on"  # Allow applications to use terminal passthrough sequences
set -g visual-activity off     # Required for image.nvim to auto show/hide images correctly
set -ga update-environment TERM          # Update TERM environment variable
set -ga update-environment TERM_PROGRAM  # Update TERM_PROGRAM environment variable

## 
## KEYBINDINGS
##
## CHANGE TMUX PREFIX TO C-a (Control + a)
set -g prefix C-a           # Set prefix to Ctrl-a
unbind C-b                  # Unbind default Ctrl-b prefix
bind-key C-a send-prefix    # Send prefix when pressing Ctrl-a twice

## RELOAD CONFIG WITH C-a r (Control + a followed by r)
unbind r                    # Unbind default 'r' binding
bind r source-file ~/.config/tmux/tmux.conf   # Prefix + r = reload config 

##
## KEYBINDINGS
##
source-file ~/.config/tmux/tmux.keybindings.conf

##
## CURSOR CONFIGURATION  
##
source-file ~/.config/tmux/tmux.cursor.conf

##
## PLUGINS
##
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
# Disable TPM auto-setup and manually configure to fix escaping issues
set -g @vim_navigator_mapping_left ""
set -g @vim_navigator_mapping_down ""  
set -g @vim_navigator_mapping_up ""
set -g @vim_navigator_mapping_right ""
set -g @vim_navigator_mapping_prev ""

# Manual vim-tmux-navigator bindings with simple, reliable pattern for homebrew nvim
# Include nu (Nushell) when running in terminal buffers (lazydocker, lazygit, etc.)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +.*(view|n?vim?x?|fzf|nu).*$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D' 
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U  
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'olimorris/tmux-pomodoro-plus'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

##
## SESSION MANAGEMENT
##

## TMUX-RESURRECT - Save and restore sessions manually
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'     # Capture pane contents
set -g @resurrect-strategy-nvim 'session'        # Restore Neovim sessions

## TMUX-CONTINUUM - Auto-save sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'                   # Auto-restore on tmux start
set -g @continuum-save-interval '15'             # Save every 15 minutes

## SESH - Smart session manager with zoxide integration
## Prefix + T = launch sesh picker in tmux popup
## Features: zoxide frecency, tmuxinator config support, session preview
bind-key "T" display-popup -E -w 80% -h 70% "sesh connect \"$(sesh list --icons | fzf --ansi --no-sort --color=bg:-1,preview-bg:-1 --border-label ' sesh ' --prompt '  ' --header '  ^a all ^t tmux ^g config ^x zoxide ^d kill' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(  )+reload(sesh list --icons)' --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' --bind 'ctrl-g:change-prompt(  )+reload(sesh list -c --icons)' --bind 'ctrl-x:change-prompt(  )+reload(sesh list -z --icons)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(  )+reload(sesh list --icons)' --preview 'sesh preview {}' --preview-window 'right:55%')\""

##
## THEME
##

## TMUX COLOR CONFIGURATIONS
set -g default-terminal "tmux-256color"
set-option -g terminal-overrides ',xterm-256color*:RGB'
set -as terminal-features ',xterm*:RGB'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

## GHOSTTY-SPECIFIC TERMINAL OVERRIDES
# Enable focus events and clipboard support for Ghostty
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
set -as terminal-features ',xterm*:focus'

## TMUX STATUS BAR
source-file ~/.config/tmux/tmux.status.conf

##
##  CATPPUCCIN THEMES
##
set -g @plugin 'catppuccin/tmux'
source-file "~/.config/tmux/tmux.theme.catppuccin.conf"
run '~/.config/tmux/plugins/tpm/tpm'

## REFRESH STATUS LINE EVERY 1 SECOND
set -g status-interval 1
