## AUTOMATIC RENAMING
setw -g allow-rename on
set -g automatic-rename on
# Smart naming: show program name, or directory basename if in a shell
# - #{pane_current_command}: the running command (nvim, zsh, fish, etc.)
# - #{b:pane_current_path}: basename of current directory
# When shell is running, show directory; otherwise show the program
set-option -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{pane_current_command}}}}"
set-option -g renumber-windows on

## TMUX STATUS BAR POSITION AND VISIBILITY
set-option -g status-position top
set-option -g status off
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-border-lines single

