##
## TMUX KEYBINDINGS CONFIGURATION
##

##
## LIST WINDOWS and SESSIONS
##
bind S choose-session          # Prefix + S = choose session interactively
bind '"' choose-window         # Prefix + " = choose window interactively  
bind ^A last-window            # Prefix + Ctrl-a = switch to last window
bind ^W list-windows           # Prefix + Ctrl-w = list all windows
bind w list-windows            # Prefix + w = list all windows

## SESSIONX FUZZY SESSION MANAGER
## Use Prefix + o to launch SessionX
## Once in SessionX:
##   - Enter: Switch to session or create new
##   - alt+backspace: Delete selected session
##   - Ctrl-u/Ctrl-d: Scroll preview up/down
##   - Ctrl-n/Ctrl-p: Select next/previous item
##   - Ctrl-r: Rename session
##   - Ctrl-w: Window mode (show all windows)
##   - Ctrl-x: Search in ~/.local/share/chezmoi
##   - Ctrl-e: Expand PWD for local directories
##   - Ctrl-b: Back to main session list
##   - Ctrl-t: Tree mode (hierarchical view)
##   - ?: Toggle preview pane

##
## VERTICAL SPLITS
##
bind v split-window -h -c "#{pane_current_path}"   # Prefix + v = vertical split (current dir)
bind | split-window -h -c "#{pane_current_path}"   # Prefix + | = vertical split (current dir)

##
## HORIZONTAL SPLITS
##
bind - split-window -c "#{pane_current_path}"      # Prefix + - = horizontal split (current dir)
bind s split-window -c "#{pane_current_path}"      # Prefix + s = horizontal split (current dir)

##
## NEW WINDOW
##
bind c new-window -c  ~/       # Prefix + c = new window (home directory)

##
## CHEZMOI WINDOWS
##
# Create new window at chezmoi directory
bind C-d new-window -c ~/.local/share/chezmoi      # Prefix + Ctrl-d = new window at chezmoi dir
# Create new window at chezmoi directory and run nvim
bind C-e new-window -c ~/.local/share/chezmoi \; send-keys 'nvim' C-m  # Prefix + Ctrl-e = new window at chezmoi + nvim

# Window swapping with global keybindings (no prefix needed)
bind-key -n C-S-p swap-window -t -1\; select-window -t -1   # Ctrl-Shift-p = move window left
bind-key -n C-S-n swap-window -t +1\; select-window -t +1   # Ctrl-Shift-n = move window right

##
## PANE NAVIGATION
##
bind-key h select-pane -L      # Prefix + h = select left pane
bind-key j select-pane -D      # Prefix + j = select down pane  
bind-key k select-pane -U      # Prefix + k = select up pane
bind-key l select-pane -R      # Prefix + l = select right pane
bind X kill-pane               # Prefix + X = kill current pane
bind x swap-pane -D            # Prefix + x = swap pane down

##
## RESIZE PANE
##
## USE MOUSE TO RESIZE PANE (much easier)
##
bind z resize-pane -Z          # Prefix + z = toggle pane zoom

bind -r -T prefix , resize-pane -L 20   # Prefix + , = resize current pane LEFT by 20 units
bind -r -T prefix . resize-pane -R 20   # Prefix + . = resize current pane RIGHT by 20 units
bind -r -T prefix - resize-pane -D 7    # Prefix + - = resize current pane DOWN by 7 units
bind -r -T prefix = resize-pane -U 7    # Prefix + = = resize current pane UP by 7 units

## VIMLIKE COPY MODE AND SELECTION
set-window-option -g mode-keys vi                          # Use vi keybindings in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection    # v = start selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle # Ctrl-v = toggle rectangle selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel  # y = copy and exit copy mode

##
## OTHER KEY BINDINGS
## 
bind R command-prompt "rename-window %%"          # Prefix + R = rename current window
bind ^L refresh-client                             # Prefix + Ctrl-l = refresh client
bind ^X lock-server                                # Prefix + Ctrl-x = lock tmux server
bind ^D detach                                     # Prefix + Ctrl-d = detach from session
bind * list-clients                                # Prefix + * = list all clients
bind : command-prompt                              # Prefix + : = tmux command prompt
bind * setw synchronize-panes                      # Prefix + * = toggle pane synchronization
bind-key -n C-S-k send-keys "clear"\; send-keys "Enter"  # Ctrl-Shift-k = clear terminal
unbind t
bind-key t set-option status                       # Prefix + t = toggle status bar

