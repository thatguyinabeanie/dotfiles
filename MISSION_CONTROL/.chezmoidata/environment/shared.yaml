# Environment Variables Configuration
# Shell-agnostic data structure for easy template processing

# Simple string variables (direct assignment)
variables:
  EDITOR: "nvim"
  VISUAL: "nvim"
  LDFLAGS: "-L/opt/homebrew/opt/openssl@3/lib"
  CPPFLAGS: "-I/opt/homebrew/opt/openssl@3/include"
  CARAPACE_BRIDGES: "zsh,bash,inshellisense"
  XDG_DATA_DIRS: ""
  XDG_CONFIG_DIRS: ""

# Template variables (evaluated at chezmoi time)
template_variables:
  BAT_THEME: "Catppuccin {{ title .CATPPUCCIN_FLAVOR }}"
  WORK_ENVIRONMENT: "{{ .WORK_ENVIRONMENT }}"
  CHEZMOI_INTERACTIVE: "{{ if .INTERACTIVE }}1{{ else }}0{{ end }}"
  GIT_NAME: "{{ .git.config.name }}"
  GITHUB_USERNAME: "{{ .git.config.username }}"
  GIT_EMAIL: "{{ .git.config.email }}"

# Path construction variables (shell handles the joining syntax)
path_variables:
  XDG_HOME:
    base: "$HOME"
  XDG_CONFIG_HOME:
    base: "$XDG_HOME"
    path: ".config"
  XDG_DATA_HOME:
    base: "$XDG_HOME"
    path: ".local/share"
  XDG_STATE_HOME:
    base: "$XDG_HOME"
    path: ".local/state"
  XDG_CACHE_HOME:
    base: "$XDG_HOME"
    path: ".cache"
  NU_CONFIG_DIR:
    base: "$XDG_CONFIG_HOME"
    path: "nushell"
  TMUX_CONFIG_DIR:
    base: "$XDG_CONFIG_HOME"
    path: "tmux"
  TMUX_PLUGIN_MANAGER_PATH:
    base: "$XDG_CONFIG_HOME"
    path: "tmux/plugins"
  TMUX_CONF:
    base: "$XDG_CONFIG_HOME"
    path: "tmux/tmux.conf"
  K9S_CONFIG_DIR:
    base: "$XDG_CONFIG_HOME"
    path: "k9s"
  STARSHIP_CONFIG:
    base: "$XDG_CONFIG_HOME"
    path: "starship/starship.toml"
  VSCODE_USER_DATA_DIR:
    base: "$XDG_CONFIG_HOME"
    path: "code"
  VSCODE_INSIDERS_USER_DATA_DIR:
    base: "$XDG_CONFIG_HOME"
    path: "code-insiders"
  GOPATH:
    base: "$XDG_CONFIG_HOME"
    path: "go"
  GOBIN:
    base: "$XDG_CONFIG_HOME"
    path: "go/bin"
  GOMODCACHE:
    base: "$XDG_CONFIG_HOME"
    path: "go/pkg/mod"
  DOTFILES_DIR:
    base: "$XDG_DATA_HOME"
    path: "chezmoi"
  GIT_CLONE_DIRECTORY:
    base: "$XDG_HOME"
    path: "source"

# Command execution variables (shell handles the execution syntax)
command_variables:
  SDKROOT: "xcrun --sdk macosx --show-sdk-path"

# Path variables that depend on command results
derived_path_variables:
  CPATH:
    base: "$SDKROOT"
    path: "usr/include"
  LIBRARY_PATH:
    base: "$SDKROOT"
    path: "usr/lib"

conditionals:
