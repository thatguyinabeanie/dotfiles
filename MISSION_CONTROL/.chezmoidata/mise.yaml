mise:
  # Core tools that should be installed on all platforms
  core_tools:
    - name: bat
      version: latest
    - name: bottom
      version: latest
    - name: delta
      version: latest
    - name: eza
      version: latest
    - name: fd
      version: latest
    - name: github-cli
      version: latest
    - name: gitui
      version: latest
    - name: jq
      version: latest
    - name: neovim
      version: stable
    - name: ripgrep
      version: latest
    - name: starship
      version: latest
    - name: tmux
      version: latest
    - name: zoxide
      version: latest

  # Development languages and runtimes
  languages:
    - name: node
      version: 22
    - name: python
      version: 3.12
    - name: go
      version: 1
    - name: rust
      version: nightly
    - name: ruby
      version: 3.2.7
    - name: deno
      version: latest
    - name: bun
      version: latest
    - name: lua
      version: latest
    - name: zig
      version: latest

  # Package managers
  package_managers:
    - name: pnpm
      version: latest
    - name: yarn
      version: latest
    - name: poetry
      version: latest
    - name: pipx
      version: latest
    - name: cargo-binstall
      version: latest
    - name: uv
      version: latest

  # Development tools
  dev_tools:
    - name: act
      version: latest
    - name: fastfetch
      version: latest
    - name: gitleaks
      version: latest
    - name: gitsign
      version: latest
    - name: golangci-lint
      version: latest
    - name: golangci-lint-langserver
      version: latest
    - name: ruff
      version: latest
    - name: shellcheck
      version: latest
    - name: stylua
      version: latest
    - name: hadolint
      version: latest

  # Python packages (installed via uv/pipx)
  python_packages:
    # MCP servers
    - name: mcp-server-fetch
      description: "MCP server for web fetching"
    - name: mcp-server-git
      description: "MCP server for git operations"

    # Development tools
    - name: black
      description: "Code formatter"
    - name: ruff
      description: "Fast linter and formatter"
    - name: mypy
      description: "Type checker"
    - name: pytest
      description: "Testing framework"
    - name: pre-commit
      description: "Git hooks framework"
    - name: debugpy
      description: "Python debugger"
    - name: isort
      description: "Import sorter"
    - name: flake8
      description: "Python linter"

    # Productivity tools
    - name: httpie
      description: "HTTP client"
    - name: rich-cli
      description: "Rich text and beautiful formatting"
    - name: typer-cli
      description: "CLI builder"
    - name: cookiecutter
      description: "Project templates"

    # Data tools
    - name: jupyter
      description: "Interactive notebooks"
    - name: pandas-profiling
      description: "Data analysis"
    - name: streamlit
      description: "Web apps for data"

    # System tools
    - name: psutil
      description: "System monitoring"
    - name: watchdog
      description: "File system monitoring"

  # NPM global packages
  npm_packages:
    - name: "@anthropic-ai/claude-code"
      description: "Claude Code integration"
    - name: "@google/gemini-cli"
      description: "Gemini CLI tool"
    - name: "@modelcontextprotocol/server-filesystem"
      description: "MCP filesystem server"
    - name: "@modelcontextprotocol/server-memory"
      description: "MCP memory server"
    - name: "mcp-hub"
      description: "MCP hub tool"
    - name: "mcp-neovim-server"
      description: "MCP Neovim server"
    - name: "pnpm"
      description: "Fast package manager"

  # Optional tools (previously installed via Homebrew)
  optional_tools:
    - name: erlang
      version: latest
    - name: elixir
      version: latest
    - name: terraform
      version: latest
    - name: kubectl
      version: latest
    - name: helm
      version: latest
    - name: gradle
      version: latest

  # All tools combined (used for config.toml generation)
  tools:
    # Core tools
    - name: bat
      version: latest
    - name: bottom
      version: latest
    - name: delta
      version: latest
    - name: eza
      version: latest
    - name: fd
      version: latest
    - name: github-cli
      version: latest
    - name: gitui
      version: latest
    - name: jq
      version: latest
    - name: neovim
      version: stable
    - name: ripgrep
      version: latest
    - name: starship
      version: latest
    - name: tmux
      version: latest
    - name: zoxide
      version: latest

    # Languages
    - name: node
      version: 22
    - name: python
      version: 3.12
    - name: go
      version: 1
    - name: rust
      version: nightly
    - name: ruby
      version: 3.2.7
    - name: deno
      version: latest
    - name: bun
      version: latest
    - name: lua
      version: latest
    - name: zig
      version: latest

    # Package managers
    - name: pnpm
      version: latest
    - name: yarn
      version: latest
    - name: poetry
      version: latest
    - name: pipx
      version: latest
    - name: cargo-binstall
      version: latest
    - name: uv
      version: latest

    # Development tools
    - name: act
      version: latest
    - name: cmake
      version: latest
    - name: fastfetch
      version: latest
    - name: gitleaks
      version: latest
    - name: gitsign
      version: latest
    - name: golangci-lint
      version: latest
    - name: golangci-lint-langserver
      version: latest
    - name: ruff
      version: latest
    - name: shellcheck
      version: latest
    - name: stylua
      version: latest
    - name: hadolint
      version: latest

    # Markdown and documentation tools
    - name: marp-cli
      version: latest
    - name: vale
      version: latest
    - name: mdbook
      version: latest

    # Optional tools
    - name: erlang
      version: latest
    - name: elixir
      version: latest
    - name: terraform
      version: latest
    - name: kubectl
      version: latest
    - name: helm
      version: latest
    - name: gradle
      version: latest
