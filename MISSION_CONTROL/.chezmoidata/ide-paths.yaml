ide_paths:
  cursor:
    darwin:
      - "/Applications/Cursor.app/Contents/MacOS/Cursor"
      - "/opt/homebrew/bin/cursor"
      - "/usr/local/bin/cursor"
    linux:
      - "/usr/bin/cursor"
      - "/usr/local/bin/cursor"
      - "/opt/cursor/cursor"
      - "/snap/bin/cursor"
  vscode_insiders:
    darwin:
      - "/Applications/Visual Studio Code - Insiders.app/Contents/MacOS/Electron"
      - "/opt/homebrew/bin/code-insiders"
      - "/usr/local/bin/code-insiders"
    linux:
      - "/usr/bin/code-insiders"
      - "/usr/local/bin/code-insiders"
      - "/opt/vscode-insiders/bin/code-insiders"
      - "/snap/bin/code-insiders"

ide_configs:
  cursor:
    ide_name: "Cursor"
    app_name: "Cursor"
    desc: "Open in Cursor"
  vscode_insiders:
    ide_name: "VS Code Insiders"
    app_name: "Visual Studio Code - Insiders"
    desc: "Open in VS Code Insiders"
