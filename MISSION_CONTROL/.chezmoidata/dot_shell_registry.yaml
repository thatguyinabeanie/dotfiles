aliases:
  y:
    default: yazi
  cat:
    default: bat --style=plain
  tks:
    default: tmux kill-server
  l:
    default: ls -l
  la:
    default: ls -la
  ll:
    default: ls -a
  dotfiles:
    default: cd "{{ .chezmoi.sourceDir }}/.."
  dotfiles-edit:
    default: nvim "{{ .chezmoi.sourceDir }}/.."
  chezmoi_data:
    default: cat ~/.config/chezmoi/chezmoi.toml
  chezmoi_data_edit:
    default: nvim ~/.config/chezmoi/chezmoi.toml
  config:
    default: cd ~/.config
  config_edit:
    default: nvim ~/.config
  spotify_play:
    default: osascript -e 'tell application "Spotify" to play'
  spotify_pause:
    default: osascript -e 'tell application "Spotify" to pause'
  spotify_next:
    default: osascript -e 'tell application "Spotify" to next track'
  spotify_prev:
    default: osascript -e 'tell application "Spotify" to previous track'

