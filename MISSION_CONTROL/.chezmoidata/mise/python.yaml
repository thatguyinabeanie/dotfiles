python:
  # Runtime & Package Managers
  - name: pipx
    version: latest
    description: "Python app installer"
  - name: poetry
    version: latest
    description: "Python dependency manager"
  - name: python
    version: 3.12
    description: "Python programming language"
  - name: uv
    version: latest
    description: "Fast Python package installer"

python_packages:
  # Code Quality & Formatting
  - name: black
    description: "Python code formatter"
  - name: flake8
    description: "Python linter"
  - name: isort
    description: "Import statement sorter"
  - name: mypy
    description: "Static type checker"
  - name: pre-commit
    description: "Git hooks framework"
  - name: ruff
    description: "Fast Python linter"

  # Testing & Debugging
  - name: debugpy
    description: "Python debugger adapter"
  - name: pytest
    description: "Testing framework"

  # CLI & Productivity Tools
  - name: cookiecutter
    description: "Project template generator"
  - name: httpie
    description: "User-friendly HTTP client"
  - name: rich-cli
    description: "Rich text formatting CLI"

  # System Utilities
  - name: watchdog
    description: "File system event monitoring"

  # MCP Servers (Python packages)
  - name: mcp-server-fetch
    description: "MCP server for web fetching"
  - name: mcp-server-git
    description: "MCP server for git operations"
