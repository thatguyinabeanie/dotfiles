##
## TMUX KEYBINDINGS CONFIGURATION
##

##
## LIST WINDOWS and SESSIONS
##
bind S choose-session
bind '"' choose-window
bind ^A last-window
bind ^W list-windows
bind w list-windows

## SESSIONX FUZZY SESSION MANAGER
## Use Prefix + o to launch SessionX
## Once in SessionX:
##   - alt+backspace: delete selected session
##   - Ctrl-u/Ctrl-d: scroll preview up/down
##   - Ctrl-n/Ctrl-p: select preview up/down
##   - Ctrl-r: rename session
##   - Ctrl-w: window mode (show all windows)
##   - Ctrl-x: search in ~/.local/share/chezmoi
##   - Ctrl-e: expand PWD for local directories
##   - Ctrl-b: back to main view
##   - Ctrl-t: tree mode
##   - ?: toggle preview pane

##
## VERTICAL SPLITS
##
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

##
## HORIZONTAL SPLITS
##
bind - split-window -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"

##
## NEW WINDOW
##
bind c new-window -c  ~/

##
## CHEZMOI WINDOWS
##
# Create new window at chezmoi directory
bind C-d new-window -c ~/.local/share/chezmoi
# Create new window at chezmoi directory and run nvim
bind C-e new-window -c ~/.local/share/chezmoi \; send-keys 'nvim' C-m

bind-key -n C-S-p swap-window -t -1\; select-window -t -1
bind-key -n C-S-n swap-window -t +1\; select-window -t +1

##
## PANE NAVIGATION
##
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind X kill-pane
bind x swap-pane -D

##
## RESIZE PANE
##
## USE MOUSE TO RESIZE PANE (much easier)
##
bind z resize-pane -Z
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7 

## VIMLIKE COPY MODE AND SELECTION
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##
## OTHER KEY BINDINGS
## 
bind R command-prompt "rename-window %%"
bind ^L refresh-client
bind ^X lock-server
bind ^D detach
bind * list-clients
bind : command-prompt
bind * setw synchronize-panes
bind-key -n C-S-k send-keys "clear"\; send-keys "Enter"
unbind t
bind-key t set-option status

