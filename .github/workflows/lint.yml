---
name: Lint

on:
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

      - name: Run golangci-lint
        working-directory: __tests__
        run: golangci-lint run --out-format=colored-line-number

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML formatting
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Shell Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.chezmoiscripts'

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          /home/linuxbrew/.linuxbrew/bin/brew shellenv >> $GITHUB_ENV
      - name: Install markdown-link-check
        run: brew install markdown-link-check
      - name: Install mise
        uses: jdx/mise-action@v1
        with:
          version: latest
      - name: Install markdownlint-cli2
        run: mise install markdownlint-cli2
      - name: Run markdownlint
        run: markdownlint-cli2 "*.md"
      - name: Check for broken links
        run: markdown-link-check "*.md" --config .markdown-link-check.json
