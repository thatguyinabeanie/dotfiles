---
name: Lint

on:
  pull_request:
    branches: ["**"]

jobs:
  # YAML:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/checkout@v4
  #    - name: Check YAML formatting
  #      uses: ibiqlik/action-yamllint@v3
  #      with:
  #        file_or_dir: .
  #        config_file: .yamllint.yml

  SHELL:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Shell Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.chezmoiscripts'

  MARKDOWN:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          files: '**/*.md'
          version: 2.30.0
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  CHEZMOI_TEMPLATES:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Validate Templates
        run: |
          # Set dummy values for template variables to enable dry-run validation
          export SHELL_PREF="zsh"
          export WORK_ENVIRONMENT="false"
          export PERSONAL_ENVIRONMENT="true"
          export INSTALL_SKETCHY_BAR="true"
          export MANAGE_BREW_SERVICES="true"
          export CATPPUCCIN_FLAVOR="mocha"
          export UI_OPACITY="0.5"
          export UI_BLUR="255"
          export UI_FONT_SIZE="20"
          export UI_FONT_FAMILY="Dank Mono"
          export UI_WINDOW_HEIGHT="65"
          export UI_WINDOW_WIDTH="160"
          export UI_CURSOR_STYLE="block_hollow"
          export UI_CURSOR_BLINK="true"
          export GIT_NAME="Test User"
          export GITHUB_USERNAME="testuser"
          export GIT_EMAIL="test@example.com"
          
          # Run chezmoi apply in dry-run mode to validate templates
          chezmoi init --source=. --dry-run --verbose
          echo "✅ Template validation successful"

