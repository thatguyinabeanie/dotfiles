name: Test Neovim Configuration

on:
  push:
    branches:
      - main
    paths:
      - 'MISSION_CONTROL/dot_config/nvim/**'
      - '_tests_/**'
      - '.github/workflows/test-nvim.yml'
  pull_request:
    paths:
      - 'MISSION_CONTROL/dot_config/nvim/**'
      - '_tests_/**'
      - '.github/workflows/test-nvim.yml'

jobs:
  test-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Run Go tests
        run: |
          cd _tests_
          go test -v ./unit -run TestNvim
