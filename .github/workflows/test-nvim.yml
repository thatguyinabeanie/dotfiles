name: Test Neovim Configuration

on:
  push:
    paths:
      - 'MISSION_CONTROL/dot_config/nvim/**'
      - '_tests_/**'
      - '.github/workflows/test-nvim.yml'
  pull_request:
    paths:
      - 'MISSION_CONTROL/dot_config/nvim/**'
      - '_tests_/**'
      - '.github/workflows/test-nvim.yml'

jobs:
  test-config:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Run Go tests
        run: |
          cd _tests_
          go test -v ./unit -run TestNvim

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: _tests_/test-results/

  test-startup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Install Neovim (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install neovim

      - name: Set up test environment
        run: |
          # Create minimal config directory
          mkdir -p ~/.config
          ln -s $GITHUB_WORKSPACE/MISSION_CONTROL/dot_config/nvim ~/.config/nvim

      - name: Install lazy.nvim
        run: |
          git clone --filter=blob:none --branch=stable \
            https://github.com/folke/lazy.nvim.git \
            ~/.local/share/nvim/lazy/lazy.nvim

      - name: Run startup performance test
        run: |
          chmod +x _tests_/scripts/test_nvim_startup.sh
          _tests_/scripts/test_nvim_startup.sh

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: startup-performance-${{ matrix.os }}
          path: /tmp/nvim-startup.log
