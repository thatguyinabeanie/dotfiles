name: Validate Dotfiles

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          brew update
          brew install nushell neovim tmux git

      - name: Install Chezmoi
        run: |
          brew install chezmoi

      - name: Validate Nushell Configuration
        run: |
          # Create necessary directories
          mkdir -p ~/.config/nushell
          mkdir -p ~/Library/Application\ Support/nushell
          
          # Create basic env.nu file with minimal configuration
          cat > ~/Library/Application\ Support/nushell/env.nu << 'EOF'
          $env.config = {
            show_banner: false,
          }
          EOF
          
          # Create basic config files in both locations
          for file in env.nu aliases.nu secrets.nu work.nu; do
            # Create in ~/.config/nushell
            touch ~/.config/nushell/$file
            # Create in ~/Library/Application Support/nushell
            touch ~/Library/Application\ Support/nushell/$file
          done
          
          # Create minimal chezmoi config
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml << 'EOF'
          [data]
          WORK_ENVIRONMENT = false
          CATPPUCCIN_FLAVOR = "mocha"
          EOF
          
          # Initialize chezmoi and apply templates
          chezmoi init --source=.
          
          # Validate each template file after processing
          for file in dot_config/nushell/*.nu.tmpl; do
            echo "Validating $file..."
            processed_file=$(chezmoi cat "$file")
            echo "$processed_file" | nu --no-config-file --env-config ~/Library/Application\ Support/nushell/env.nu -c "source /dev/stdin; exit 0" || { echo "Error in $file"; exit 1; }
          done

      - name: Validate Neovim Configuration
        run: |
          nvim --headless --noplugin -c "lua require('lazy').setup({})" -c q

      - name: Validate Tmux Configuration
        run: |
          tmux start-server
          tmux source-file dot_config/tmux/tmux.conf
          tmux kill-server

      - name: Check Git Configuration
        run: |
          git config --file dot_config/git/config.tmpl --list

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          pip install trufflehog

      - name: Scan for Secrets
        run: |
          trufflehog filesystem . --only-verified

  dependencies:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          brew update
          brew outdated

      - name: Check mise Versions
        run: |
          brew install mise
          mise install
          mise list

  documentation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint --config .markdownlint.json '**/*.md'

      - name: Check for Broken Links
        run: |
          brew install lychee
          lychee **/*.md 
