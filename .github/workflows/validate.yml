name: Validate Dotfiles

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          brew update
          brew install nushell neovim tmux git

      - name: Validate Nushell Configuration
        run: |
          # Create necessary directories
          mkdir -p ~/.config/nushell
          mkdir -p ~/Library/Application\ Support/nushell
          
          # Create basic env.nu file with minimal configuration
          cat > ~/Library/Application\ Support/nushell/env.nu << 'EOF'
          $env.config = {
            show_banner: false,
          }
          EOF
          
          # Create basic config files in both locations
          for file in env.nu aliases.nu secrets.nu work.nu; do
            # Create in ~/.config/nushell
            touch ~/.config/nushell/$file
            # Create in ~/Library/Application Support/nushell
            touch ~/Library/Application\ Support/nushell/$file
          done
          
          # Copy Catppuccin theme files if they exist
          if [ -d dot_config/nushell/.catppuccin ]; then
            cp -r dot_config/nushell/.catppuccin ~/.config/nushell/
          fi
          
          # Validate each template file
          for file in dot_config/nushell/*.nu.tmpl; do
            echo "Validating $file..."
            # Use nushell to parse the file without executing it
            nu --no-config-file --env-config ~/Library/Application\ Support/nushell/env.nu -c "source $file; exit 0" || { echo "Error in $file"; exit 1; }
          done

      - name: Validate Neovim Configuration
        run: |
          nvim --headless --noplugin -c "lua require('lazy').setup({})" -c q

      - name: Validate Tmux Configuration
        run: |
          tmux start-server
          tmux source-file dot_config/tmux/tmux.conf
          tmux kill-server

      - name: Check Git Configuration
        run: |
          git config --file dot_config/git/config.tmpl --list

  security:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and Configure Docker
        run: |
          brew install colima
          colima start
          
      - name: Install TruffleHog
        run: |
          # Try to install via docker directly since homebrew tap is failing
          docker pull trufflesecurity/trufflehog:latest

      - name: Scan for Secrets
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest filesystem --directory /repo --json | jq -r '.SourceMetadata.Data.Filesystem.file' || true

      - name: Check for GPG Keys
        run: |
          if grep -r "BEGIN PGP" .; then
            echo "Warning: Possible GPG key found in repository"
            exit 1
          fi

      - name: Check for API Keys and Tokens
        run: |
          # Check for common API key patterns
          if grep -r -E "(api[_-]?key|token|secret|password|credential)" --include="*.{json,yaml,yml,toml,env,conf,config,nu,lua,tmpl}" .; then
            echo "Warning: Possible API keys or tokens found in repository"
            # Don't fail the build, just warn
            # exit 1
          fi

  dependencies:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          brew update
          brew outdated

      - name: Check mise Versions
        run: |
          brew install mise
          mise install
          mise list

  documentation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown
        run: markdownlint --config .markdownlint.json '**/*.md'

      - name: Check for Broken Links
        run: |
          brew install lychee
          lychee **/*.md 
