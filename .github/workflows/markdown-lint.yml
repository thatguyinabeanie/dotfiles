name: Markdown Lint and Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly
  workflow_dispatch:  # Allow manual triggers

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli markdownlint-cli2

      - name: Lint Markdown
        run: markdownlint '**/*.md'

  fix:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli markdownlint-cli2

      - name: Fix Markdown
        run: |
          # Fix line length issues
          find . -name "*.md" -exec sed -i '' 's/\([^ ]\{80,\}\)/\1\n/g' {} \;
          
          # Add blank lines around lists
          find . -name "*.md" -exec sed -i '' 's/^\([^#\n].*\)$/\n\1\n/g' {} \;
          
          # Add blank lines around headings
          find . -name "*.md" -exec sed -i '' 's/^\(#.*\)$/\n\1\n/g' {} \;
          
          # Add blank lines around code blocks
          find . -name "*.md" -exec sed -i '' 's/^```\([^`]*\)$/```\1\n/g' {} \;
          
          # Remove trailing spaces
          find . -name "*.md" -exec sed -i '' 's/[[:space:]]*$//g' {} \;
          
          # Ensure files end with a single newline
          find . -name "*.md" -exec sed -i '' -e :a -e '/^\n*$/{$d;N;ba' -e '}' {} \;
          find . -name "*.md" -exec sh -c 'echo "" >> "$1"' sh {} \;

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix-markdown-formatting
          title: 'style: fix markdown formatting'
          commit-message: 'style: fix markdown formatting'
          body: |
            Fixes markdown formatting issues:
            
            - Line length limits
            - Blank lines around lists
            - Blank lines around headings
            - Blank lines around code blocks
            - Trailing spaces
            - File endings
            
            This PR was automatically created by GitHub Actions.
          labels: documentation,automated
          delete-branch: true 