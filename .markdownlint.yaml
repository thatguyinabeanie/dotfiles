---
default: true
# MD013 (line length) is slow and not critical for this repo, so we set a higher limit for readability.
MD013:
  line_length: 200
  code_blocks: false
  tables: false
MD033:
  allowed_elements:
    - a
    - img
    - br
    - hr
    - code
    - pre
    - div
    - align
    - p
    - h3
    - span
    - kbd
    - sup
    - sub
MD041: false  # Allow front matter at the top (no forced first heading)
MD024:
  siblings_only: true
MD026: false  # (Optional) Trailing punctuation in headings, if you use e.g. "Q: What is this?"
MD029:
  style: ordered
MD036: false
MD025: false
MD045: false
# MD040 and MD032 are enabled (not listed here) to enforce:
# - Code blocks should specify a language
# - Lists should have blank lines around them
MD009: true  # Enforce no trailing spaces
MD047: false  # (Optional) Allow multiple newlines at end of file, common in Obsidian
MD004: false  # (Optional) Unordered list style, if you mix -, *, +
