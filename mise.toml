[tools]
# Core development tools for this repository
go = "1"                 # Go runtime (from go.mod requirement)
golangci-lint = "latest" # Go linter (used in lefthook)

# Shell and text processing
shellcheck = "latest" # Shell script linter (used in lefthook)  
vale = "latest"       # Prose linter (used in lefthook)

# Security and secrets scanning
gitleaks = "latest" # Secrets scanner (used in lefthook)

# Node.js ecosystem (for scripts and tools)
lefthook = "latest"
stylua = "latest"
make = "latest"

[hooks]
# Automatically setup lefthook after installing tools
postinstall = "mise run setup-hooks || echo 'lefthook install failed - run: mise run setup-hooks'"

[settings]
jobs = 4            # Parallel installation jobs
experimental = true # Enable experimental features
verbose = false     # Reduce noise in output
yes = true          # Auto-confirm prompts
auto_install = true

[tasks.setup-hooks]
description = "Install lefthook Git hooks (run after cloning repo)"
run = "lefthook install"

[tasks.test]
description = "Run all Go tests"
run = "cd _tests_ && go test ./..."

[tasks.test-verbose]
description = "Run all Go tests with verbose output"
run = "cd _tests_ && go test -v ./..."

[tasks.test-changed]
description = "Run tests for changed files only"
run = "cd _tests_ && ./scripts/run_relevant_tests.sh"

[tasks.test-nvim]
description = "Test Neovim configuration startup"
run = "_tests_/scripts/test_nvim_startup.sh"

[tasks.lint]
description = "Run all quality checks"
run = "lefthook run pre-commit"

[tasks.apply]
description = "Apply dotfiles changes"
run = "chezmoi apply"

[tasks.diff]
description = "Show dotfiles differences"
run = "chezmoi diff"

[tasks.sync]
description = "Apply dotfiles and show diff"
run = ["chezmoi apply", "chezmoi diff"]
