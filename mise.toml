# Development dependencies for dotfiles repository
# Tools needed for linting and maintaining the dotfiles

[tools]
# Core development tools
lefthook = "latest"            # Git hooks manager
gitleaks = "latest"            # Secret scanning

# Linting and formatting tools
vale = "latest"                # Prose linter for markdown
shellcheck = "latest"          # Shell script linter
stylua = "latest"              # Lua formatter
# luacheck = "latest"            # Lua linter
markdownlint-cli2 = "latest"   # Markdown linter

# Optional development tools
chezmoi = "latest"             # Dotfiles manager (for testing)
marksman = "latest"            # Markdown LSP server

node = "22"
bun = "latest"
"npm:markdown-link-check" = "latest"
# Note: postinstall hook removed because it only works in the chezmoi directory context
# Run `mise run install-npm-packages` manually when needed for development

[tasks]
# Common development tasks
lint = "lefthook run pre-commit --all-files"
format = "stylua --config-path .stylua.toml --glob '**/*.lua' ."

[tasks.install-npm-packages]
run = "bun install"

# Claude Code records newly-approved permission rules straight into
# ~/.claude/settings.json at runtime. dot_claude/modify_settings.json replaces the whole
# `permissions` key from source, so anything recorded live is lost on the next
# `chezmoi apply`. This reports that drift so worthwhile rules can be promoted into
# .chezmoidata/claude.yaml by hand. Deliberately does NOT auto-merge: auto-recorded rules
# are mostly single-use exact-match noise, which is how the list previously reached 159
# entries.
[tasks.claude-perms-drift]
description = "Report permission rules in ~/.claude/settings.json missing from source"
run = '''
set -eu
live=$(mktemp)
src=$(mktemp)
trap 'rm -f "$live" "$src"' EXIT
data=$(chezmoi data --format json)
status=0
for key in allow deny; do
  jq -r --arg k "$key" '.permissions[$k] // [] | .[]' "$HOME/.claude/settings.json" \
    | sort -u > "$live"
  printf '%s' "$data" | jq -r --arg k "$key" '.claude_permissions[$k] // [] | .[]' \
    | sort -u > "$src"
  drift=$(comm -13 "$src" "$live")
  if [ -n "$drift" ]; then
    status=1
    printf '\n== %s: live but NOT in .chezmoidata/claude.yaml (lost on next apply) ==\n' "$key"
    printf '%s\n' "$drift"
  else
    printf '\n== %s: in sync ==\n' "$key"
  fi
done
exit "$status"
'''


